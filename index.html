  <style>
    :root {
      --accent: #7030A0;
      --accent-light: #b58bd3;
      --text: #f5f2f7;
      --muted: #c4bdca;
      --muted-2: #96909d;
      --card: rgba(18, 17, 21, .72);
      --line: rgba(255, 255, 255, .105);
      --line-strong: rgba(255, 255, 255, .16);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: #08070b;
      font-family: Inter, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(900px 520px at 12% -10%, rgba(112,48,160,.30), transparent 60%),
        radial-gradient(720px 520px at 100% 110%, rgba(112,48,160,.20), transparent 60%);
    }
    button, textarea { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    a { color: #d9b9ef; text-decoration: none; }
    a:hover { color: #fff; }
    :focus-visible { outline: 3px solid #c49be0; outline-offset: 3px; }
    ::selection { background: rgba(112,48,160,.5); color: #fff; }
    .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .icon-sm { width: 16px; height: 16px; }
    .icon-lg { width: 26px; height: 26px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .app { position: relative; display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 820px; margin: 0 auto; }

    /* ---- header ---- */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); background: rgba(8,7,11,.7); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .orb { display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(145deg, #8a3fc4, #5b2485); color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 6px 20px rgba(112,48,160,.4); }
    .brand-text { display: grid; line-height: 1.2; min-width: 0; }
    .brand-name { font-weight: 720; font-size: 1.02rem; letter-spacing: .02em; }
    .brand-cap { color: var(--muted-2); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tools { display: flex; align-items: center; gap: 8px; }
    .switch { display: inline-flex; padding: 3px; border: 1px solid var(--line-strong); border-radius: 12px; background: rgba(255,255,255,.045); }
    .switch button { min-width: 42px; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: .8rem; font-weight: 650; cursor: pointer; }
    .switch button:hover { color: #fff; }
    .switch button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 44px; height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: rgba(255,255,255,.045); color: #eee5f4; font-size: .8rem; font-weight: 600; cursor: pointer; transition: background .18s ease; }
    .icon-btn:hover { background: rgba(255,255,255,.10); }
    .icon-btn .label { display: none; }

    /* ---- chat ---- */
    .chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 18px 14px 8px; scroll-padding-top: 12px; overscroll-behavior: contain; }
    .stream { display: flex; flex-direction: column; gap: 14px; direction: ltr; }
    .msg { display: flex; gap: 10px; max-width: 100%; }
    .msg.bot { align-self: flex-start; width: 100%; }
    .msg.user { align-self: flex-end; max-width: 88%; }
    .avatar { display: grid; place-items: center; flex: 0 0 auto; width: 30px; height: 30px; margin-top: 2px; border-radius: 10px; background: linear-gradient(145deg, #8a3fc4, #5b2485); color: #fff; }
    .bot-body { min-width: 0; flex: 1 1 auto; display: grid; gap: 10px; justify-items: start; }
    .bubble { max-width: min(100%, 620px); padding: 11px 15px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; font-size: .96rem; line-height: 1.75; }
    .bot .bubble { border: 1px solid var(--line); border-top-left-radius: 6px; background: var(--card); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    .user .bubble { border-top-right-radius: 6px; background: var(--accent); color: #fff; }
    .bubble.err { border-color: rgba(230,160,160,.35); }
    .typing { display: inline-flex; gap: 5px; padding: 15px 16px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-light); animation: blink 1.1s ease-in-out infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg { animation: rise .3s ease both; }
    .card { animation: rise .4s ease both; }
    .retry { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; margin-top: 8px; padding: 6px 14px; border: 1px solid rgba(181,139,211,.4); border-radius: 12px; background: rgba(112,48,160,.2); color: #fff; font-weight: 600; font-size: .86rem; cursor: pointer; }
    .retry:hover { background: rgba(112,48,160,.4); }

    /* ---- comparison card ---- */
    .card { width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }

    .heads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .head { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 11px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.03); }
    .thumb { display: grid; place-items: center; width: 52px; height: 52px; overflow: hidden; border-radius: 11px; background: rgba(255,255,255,.06); color: var(--accent-light); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .badge-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { display: inline-grid; place-items: center; min-width: 21px; height: 21px; padding: 0 6px; border: 1px solid rgba(181,139,211,.4); border-radius: 7px; color: #e0c8f0; font-size: .68rem; font-weight: 700; }
    .win-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 7px; background: var(--accent); color: #fff; font-size: .66rem; font-weight: 650; }
    .name { margin: 3px 0 0 !important; font-size: .95rem; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; line-height: 1.35; }
    .meta { margin: 0; color: var(--muted-2); font-size: .74rem; }
    .price { display: inline-block; margin-top: 4px; padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 8px; color: #e6dded; font-size: .72rem; }
    .summary { grid-column: 1 / -1; margin: 2px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.7; }
    .sec { margin-top: 18px; }

    .legend { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 2px; color: var(--muted); font-size: .76rem; font-weight: 600; }
    .legend span { min-width: 0; overflow-wrap: anywhere; }
    .row { margin-top: 11px; }
    .row-label { margin-bottom: 4px; color: var(--muted-2); font-size: .74rem; text-align: center; }
    .bars { display: grid; grid-template-columns: 2.3em 1fr 1fr 2.3em; align-items: center; gap: 6px; }
    .num { color: var(--muted-2); font-size: .8rem; font-variant-numeric: tabular-nums; text-align: center; }
    .num.win { color: #fff; font-weight: 700; }
    .track { display: flex; height: 9px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
    .track.ta { justify-content: flex-end; }
    .track.tb { justify-content: flex-start; }
    .fill { width: 0; height: 100%; border-radius: 999px; background: rgba(255,255,255,.26); transition: width .6s ease; }

    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .col-title { margin: 0 0 8px !important; font-size: .86rem; font-weight: 650; overflow-wrap: anywhere; }
    .list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }

    .list .icon { margin-top: 3px; }
    .ok { color: #b9e2c4; }
    .no { color: #e6b3b3; }
    .empty { margin: 0; color: var(--muted-2); font-size: .82rem; }
    .best { padding: 12px 13px; border-top: 1px solid rgba(181,139,211,.42); background: rgba(255,255,255,.025); }
    .best strong { display: block; margin-bottom: 4px; font-size: .86rem; overflow-wrap: anywhere; }
    .best span { color: var(--muted); font-size: .82rem; line-height: 1.7; }
    details.more { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.025); }
    details.more summary { display: flex; align-items: center; min-height: 44px; padding: 0 14px; color: #d2b5e7; font-size: .7rem; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; }
    details.more .inner { padding: 0 14px 14px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: .8rem; }
    th, td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
    thead th { background: rgba(255,255,255,.04); color: #e6dded; }
    tbody th { color: var(--muted-2); font-weight: 600; white-space: nowrap; }
    tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
    td.best-cell { background: rgba(112,48,160,.26); color: #fff; font-weight: 650; }
    .verdict { margin-top: 18px; padding: 15px; border: 1px solid rgba(181,139,211,.4); border-radius: 16px; background: linear-gradient(135deg, rgba(112,48,160,.24), rgba(112,48,160,.06)); }
    .verdict-top { display: flex; align-items: center; gap: 12px; }
    .verdict-icon { display: grid; place-items: center; flex: 0 0 auto; width: 42px; height: 42px; border: 1px solid rgba(181,139,211,.3); border-radius: 13px; background: rgba(112,48,160,.25); color: #e8d3f5; }
    .verdict-kicker { margin: 0 !important; color: #d2b5e7; font-size: .68rem; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; }
    .verdict-name { margin: 1px 0 0 !important; font-size: 1.12rem; font-weight: 660; overflow-wrap: anywhere; }
    .verdict-reason { margin: 11px 0 0; color: #ddd5e4; font-size: .88rem; line-height: 1.8; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .disclaimer { flex: 1 1 220px; margin: 0; color: var(--muted-2); font-size: .72rem; line-height: 1.65; }
    .copy-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: rgba(255,255,255,.06); color: #f3edf7; font-size: .82rem; font-weight: 600; cursor: pointer; }
    .copy-btn:hover { background: rgba(255,255,255,.12); }

    /* ---- composer ---- */
    .composer { padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(8,7,11,.96) 60%, rgba(8,7,11,0)); }
    .chips { display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips:empty { display: none; }
    .chip { flex: 0 0 auto; min-height: 38px; padding: 6px 13px; border: 1px solid var(--line-strong); border-radius: 12px; background: rgba(255,255,255,.05); color: #e6dded; font-size: .8rem; cursor: pointer; white-space: nowrap; }
    .chip:hover { background: rgba(255,255,255,.11); border-color: rgba(181,139,211,.4); }
    .compose { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 14px; border: 1px solid var(--line-strong); border-radius: 18px; background: rgba(22,20,27,.92); }
    .compose:focus-within { border-color: var(--accent-light); }
    .compose textarea { flex: 1 1 auto; min-width: 0; max-height: 140px; padding: 9px 0; border: 0; outline: none; resize: none; background: transparent; font-size: 1rem; line-height: 1.5; color: var(--text); }
    .compose textarea::placeholder { color: var(--muted-2); }
    .send { display: grid; place-items: center; flex: 0 0 auto; width: 44px; height: 44px; border: 0; border-radius: 13px; background: var(--accent); color: #fff; cursor: pointer; transition: background .18s ease, opacity .18s ease; }
    .send:hover { background: #8240b4; }
    .send:disabled { opacity: .45; cursor: not-allowed; }
    .note { margin: 8px 4px 0; color: var(--muted-2); font-size: .7rem; text-align: center; line-height: 1.5; }

    @media (min-width: 640px) {
      .icon-btn .label { display: inline; }
      .chat { padding: 24px 20px 10px; }
      .top, .composer { padding-inline: 20px; }
    }
    @media (max-width: 560px) {
      .heads, .cols { grid-template-columns: 1fr; }
      .card { padding: 13px; }
      .brand-cap { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

        welcome: 'من هوش مصنوعی newniom ai هستم. گوشی، لپ‌تاپ، تبلت و کامپیوتر مقایسه می‌کنم؛ دو دستگاهی که بینشان مردد هستی را بگو تا برایت بررسی کنم. چی را مقایسه کنیم؟',
        cmpText: '{a} را با {b} مقایسه کن',
        follow: ['برای گیمینگ کدام بهتر است؟', 'دوربین کدام بهتر است؟', 'کدام بادوام‌تر است؟'],
        errNetwork: 'به سرور وصل نشدم. اینترنتت را بررسی کن و دوباره تلاش کن.',
        errTimeout: 'خیلی طول کشید. دوباره تلاش کن.',
        errRate: 'پیام‌ها زیاد بود. یک دقیقه صبر کن و دوباره تلاش کن.',
        errQuota: 'سهمیه‌ی رایگان امروز تمام شده است. بعداً دوباره تلاش کن.',
        errBad: 'نتوانستم پیامت را بخوانم. کمی بازنویسی‌اش کن.',
        errServer: 'مشکلی از سمت من پیش آمد. دوباره تلاش کن.',
        retry: 'تلاش دوباره',
        scores: 'امتیازها', specs: 'مشخصات فنی', advantages: 'برتری‌ها', bestFor: 'مناسب برای', prosCons: 'مزایا و معایب',
        verdict: 'نتیجه‌ی نهایی', spec: 'مشخصه', winner: 'برنده', tie: 'مساوی', over: '{x} نسبت به {y}',
        copy: 'کپی خلاصه', copied: 'کپی شد', copyFail: 'کپی نشد', none: '—',
        m: { performance: 'عملکرد', display: 'نمایشگر', camera: 'دوربین', battery: 'باتری', portability: 'قابلیت حمل', value: 'ارزش خرید' },
        s: { screen: 'صفحه‌نمایش', processor: 'پردازنده', ram: 'رم', storage: 'حافظه', camera: 'دوربین', battery: 'باتری', os: 'سیستم‌عامل', weight: 'وزن' },
      },
    };
    const STARTERS = [['iPhone 16', 'Galaxy S25'], ['MacBook Air M3', 'Dell XPS 13'], ['iPad Air', 'Galaxy Tab S9']];
    const METRICS = ['performance', 'display', 'camera', 'battery', 'portability', 'value'];
    const SPECS = ['screen', 'processor', 'ram', 'storage', 'camera', 'battery', 'os', 'weight'];
    const SPEC_SCORE = { screen: 'display', processor: 'performance', ram: 'performance', camera: 'camera', battery: 'battery', weight: 'portability' };

    const $ = (id) => document.getElementById(id);
    const el = { chat: $('chat'), stream: $('stream'), chips: $('chips'), form: $('form'), input: $('input'), send: $('send'), newChat: $('newChat') };

    let lang = 'en';
    try { const s = localStorage.getItem(STORE_KEY); if (s === 'en' || s === 'fa') lang = s; } catch (e) {}
    const history = [];       // [{role, content}] sent to the worker
    let busy = false;
    let session = 0;          // bumps on "New chat" so stale replies are ignored

    const tr = (L, k) => I18N[L][k];
    const t = (k) => tr(lang, k);

    /* ---------- tiny DOM helpers (all text goes through textContent) ---------- */
    const h = (tag, cls, txt) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (txt !== undefined && txt !== null) n.textContent = String(txt);
      return n;
    };
    const auto = (n) => { n.setAttribute('dir', 'auto'); return n; };
    const ico = (id, cls) => {
      const s = document.createElementNS(NS, 'svg');
      s.setAttribute('class', 'icon' + (cls ? ' ' + cls : ''));
      s.setAttribute('aria-hidden', 'true');
      const u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#' + id);
      s.appendChild(u);
      return s;
    };
    const known = (v) => v !== undefined && v !== null && String(v).trim() !== '' && String(v).toLowerCase() !== 'unknown';
    const num = (v) => { const n = typeof v === 'string' ? parseFloat(v) : v; return typeof n === 'number' && isFinite(n) ? Math.max(0, Math.min(10, n)) : null; };
    const fmt = (L, n) => (n === null ? tr(L, 'none') : String(Math.round(n * 10) / 10));
    const nearBottom = () => el.chat.scrollHeight - el.chat.scrollTop - el.chat.clientHeight < 140;
    const toBottom = () => { el.chat.scrollTo({ top: el.chat.scrollHeight, behavior: reduceMotion ? 'auto' : 'smooth' }); };

    /* ---------- language / chrome ---------- */
    function applyChrome() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = t(n.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-ph]').forEach((n) => n.setAttribute('placeholder', t(n.getAttribute('data-i18n-ph'))));
      document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)));
    }
    document.querySelectorAll('[data-lang]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-lang');
        if (next === lang) return;
        lang = next;
        try { localStorage.setItem(STORE_KEY, lang); } catch (e) {}
        applyChrome();
        if (!history.length) resetChat(); else if (el.chips.children.length) showChips(chipMode);
      });
    });

    /* ---------- chips ---------- */
    let chipMode = 'start';
    function showChips(mode, L) {
      chipMode = mode;
      const CL = L || lang;
      el.chips.replaceChildren();
      const items = mode === 'start'
        ? STARTERS.map(([a, b]) => ({ label: a + ' vs ' + b, text: tr(lang, 'cmpText').replace('{a}', a).replace('{b}', b) }))
        : tr(CL, 'follow').map((x) => ({ label: x, text: x }));
      items.forEach((it) => {
        const b = h('button', 'chip', it.label);
        b.type = 'button';
        b.addEventListener('click', () => send(it.text));
        el.chips.append(b);
      });
    }
    const hideChips = () => el.chips.replaceChildren();

    /* ---------- messages ---------- */
    function addUser(text) {
      const m = h('div', 'msg user');
      m.append(auto(h('div', 'bubble', text)));
      el.stream.append(m);
      toBottom();
    }

    function botShell() {
      const m = h('div', 'msg bot');
      const av = h('span', 'avatar'); av.append(ico('i-spark', 'icon-sm'));
      const body = h('div', 'bot-body');
      m.append(av, body);
      el.stream.append(m);
      return { m, body };
    }

    function addTyping() {
      const { m, body } = botShell();
      const b = h('div', 'bubble typing');
      b.setAttribute('aria-hidden', 'true');
      b.append(h('i'), h('i'), h('i'));
      body.append(b);
      toBottom();
      return m;
    }

    function typeInto(node, text) {
      return new Promise((resolve) => {
        if (reduceMotion || text.length < 8) { node.textContent = text; return resolve(); }
        const step = Math.max(1, Math.ceil(text.length / 70));
        let i = 0;
        const tick = () => {
          i = Math.min(text.length, i + step);
          node.textContent = text.slice(0, i);
          if (nearBottom()) el.chat.scrollTop = el.chat.scrollHeight;
          if (i < text.length) setTimeout(tick, 22); else resolve();
        };
        tick();
      });
    }

    async function addBot(text, L, extraBuilder) {
      const { m, body } = botShell();
      const bubble = h('div', 'bubble');
      bubble.setAttribute('dir', 'auto');
      bubble.lang = L;
      const live = h('span', 'sr', text);
      const vis = h('span');
      vis.setAttribute('aria-hidden', 'true');
      bubble.append(vis, live);
      body.append(bubble);
      toBottom();
      await typeInto(vis, text);
      if (extraBuilder) extraBuilder(body, m);
      return m;
    }

    function addError(code) {
      const map = { rate_limited: 'errRate', quota_exceeded: 'errQuota', bad_input: 'errBad', bad_request: 'errBad', timeout: 'errTimeout', network: 'errNetwork' };
      const { m, body } = botShell();
      const b = h('div', 'bubble err', t(map[code] || 'errServer'));
      b.setAttribute('dir', 'auto');
      body.append(b);
      const btn = h('button', 'retry');
      btn.type = 'button';
      btn.append(ico('i-retry', 'icon-sm'), h('span', '', t('retry')));
      btn.addEventListener('click', () => { m.remove(); ask(); });
      body.append(btn);
      toBottom();
    }

    /* ---------- worker call ---------- */
    async function callChat(messages) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 55000);
      let res;
      try {
        res = await fetch(WORKER_URL.replace(/\/+$/, '') + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lang, messages }),
          signal: ctrl.signal,
        });
      } catch (e) {
        throw { code: e && e.name === 'AbortError' ? 'timeout' : 'network' };
      } finally { clearTimeout(timer); }
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok || !data) throw { code: (data && data.error) || 'server' };
      return data;
    }

    function compact(data) {
      let s = data.reply;
      const c = data.comparison;
      if (c) {
        const [A, B] = c.devices;
        const w = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : 'tie';
        const sc = METRICS.map((k) => k + ' ' + fmt('en', num(A.scores[k])) + '/' + fmt('en', num(B.scores[k]))).join(', ');
        s += '\n[comparison card shown: ' + A.name + ' vs ' + B.name + '; winner: ' + w + '; scores ' + sc + ']';
      }
      return s.slice(0, 850);
    }

    function send(text) {
      text = String(text || '').replace(/[ \t]+\n/g, '\n').trim().slice(0, MAX_CHARS);
      if (!text || busy) return;
      hideChips();
      addUser(text);
      history.push({ role: 'user', content: text });
      el.input.value = '';
      autosize();
      ask();
    }

    async function ask() {
      const mine = session;
      busy = true; el.send.disabled = true;
      const typing = addTyping();
      try {
        const data = await callChat(history.slice(-10));
        if (mine !== session) return;
        typing.remove();
        const L = data.lang === 'fa' ? 'fa' : 'en';
        history.push({ role: 'assistant', content: compact(data) });
        await addBot(data.reply, L, data.comparison ? (body, m) => {
          const card = buildCard(data.comparison, L);
          body.append(card);
          animateBars(card);
          showChips('follow', L);
          if (!reduceMotion) m.scrollIntoView({ block: 'start', behavior: 'smooth' }); else m.scrollIntoView({ block: 'start' });
        } : null);
        if (!data.comparison && history.some((x) => x.content.indexOf('[comparison card shown') !== -1)) showChips('follow', L);
      } catch (err) {
        if (mine !== session) return;
        typing.remove();
        addError(err && err.code);
      } finally {
        if (mine === session) { busy = false; el.send.disabled = false; if (!coarse) el.input.focus(); }
      }
    }

    /* ---------- images (Wikipedia) ---------- */
    const imgCache = new Map();
    function wikiImage(name) {
      if (imgCache.has(name)) return imgCache.get(name);
      const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=200&gsrsearch=' + encodeURIComponent(name);
      const p = fetch(u).then((r) => r.json()).then((j) => {
        const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
        pages.sort((x, y) => (x.index || 0) - (y.index || 0));
        const hit = pages.find((pg) => pg.thumbnail && pg.thumbnail.source);
        if (!hit) return null;
        try { return /(^|\.)wikimedia\.org$/.test(new URL(hit.thumbnail.source).hostname) ? hit.thumbnail.source : null; } catch (e) { return null; }
      }).catch(() => null);
      imgCache.set(name, p);
      return p;
    }
    function iconFor(d, category) {
      const map = { phone: 'phone', laptop: 'laptop', tablet: 'tablet', computer: 'desktop' };
      if (map[category]) return 'i-' + map[category];
      const n = String(d.name || '').toLowerCase();
      if (/iphone|galaxy s|galaxy z|pixel|phone|redmi|poco|oneplus|xperia/.test(n)) return 'i-phone';
      if (/ipad|tab |tablet|matepad/.test(n)) return 'i-tablet';
      if (/macbook|laptop|thinkpad|zenbook|xps|legion|zephyrus|ideapad|vivobook|inspiron|spectre/.test(n)) return 'i-laptop';
      if (/imac|mac mini|mac studio|mac pro|desktop|tower|optiplex|all-in-one|nuc/.test(n)) return 'i-desktop';
      return 'i-cpu';
    }

    /* ---------- comparison card ---------- */
    function list(L, items, iconId, cls) {
      const arr = Array.isArray(items) ? items.filter(Boolean) : [];
      if (!arr.length) return auto(h('p', 'empty', tr(L, 'none')));
      const ul = h('ul', 'list');
      arr.forEach((s) => { const li = h('li'); li.append(ico(iconId, 'icon-sm ' + cls), auto(h('span', '', s))); ul.append(li); });
      return ul;
    }

    function headCard(L, d, letter, c) {
      const box = h('div', 'head');
      const th = h('div', 'thumb'); th.append(ico(iconFor(d, c.category), 'icon-lg'));
      const body = h('div');
      const row = h('div', 'badge-row');
      row.append(h('span', 'badge', letter.toUpperCase()));
      if (c.verdict.winner === letter) { const w = h('span', 'win-chip'); w.append(ico('i-trophy', 'icon-sm'), h('span', '', tr(L, 'winner'))); row.append(w); }
      body.append(row, auto(h('h4', 'name', d.name)));
      const meta = [d.brand, d.year].filter(known).join(' · ');
      if (meta) body.append(auto(h('p', 'meta', meta)));
      if (known(d.price_range)) body.append(auto(h('span', 'price', d.price_range)));
      box.append(th, body, auto(h('p', 'summary', d.summary || '')));
      wikiImage(d.name).then((src) => {
        if (!src || !th.isConnected) return;
        const img = document.createElement('img');
        img.loading = 'lazy'; img.decoding = 'async'; img.alt = d.name; img.referrerPolicy = 'no-referrer';
        img.addEventListener('load', () => th.replaceChildren(img));
        img.src = src;
      });
      return box;
    }

    function buildCard(c, L) {
      const [A, B] = c.devices;
      const card = h('section', 'card');
      card.setAttribute('dir', L === 'fa' ? 'rtl' : 'ltr');
      card.lang = L;

      const heads = h('div', 'heads');
      heads.append(headCard(L, A, 'a', c), headCard(L, B, 'b', c));
      card.append(heads);

      // scores
      const sc = h('div', 'sec');
      sc.append(h('h5', 'sec-title', tr(L, 'scores')));
      const legend = h('div', 'legend');
      legend.append(auto(h('span', '', A.name)), auto(h('span', '', B.name)));
      sc.append(legend);
      METRICS.forEach((k) => {
        const a = num(A.scores && A.scores[k]), b = num(B.scores && B.scores[k]);
        const aw = a !== null && b !== null && a > b, bw = a !== null && b !== null && b > a;
        const row = h('div', 'row');
        row.setAttribute('role', 'group');
        row.setAttribute('aria-label', tr(L, 'm')[k] + ': ' + A.name + ' ' + fmt(L, a) + ', ' + B.name + ' ' + fmt(L, b));
        row.append(h('div', 'row-label', tr(L, 'm')[k]));
        const bars = h('div', 'bars');
        const ta = h('div', 'track ta'), tb = h('div', 'track tb');
        const fa = h('div', 'fill' + (aw ? ' win' : '')), fb = h('div', 'fill' + (bw ? ' win' : ''));
        fa.dataset.w = a === null ? 0 : a * 10; fb.dataset.w = b === null ? 0 : b * 10;
        ta.append(fa); tb.append(fb);
        bars.append(h('span', 'num' + (aw ? ' win' : ''), fmt(L, a)), ta, tb, h('span', 'num' + (bw ? ' win' : ''), fmt(L, b)));
        row.append(bars);
        sc.append(row);
      });
      card.append(sc);

      // advantages
      const adv = h('div', 'sec');
      adv.append(h('h5', 'sec-title', tr(L, 'advantages')));
      const cols = h('div', 'cols');
      const c1 = h('div'), c2 = h('div');
      c1.append(auto(h('h5', 'col-title', tr(L, 'over').replace('{x}', A.name).replace('{y}', B.name))), list(L, c.advantages && c.advantages.a_over_b, 'i-check', 'ok'));
      c2.append(auto(h('h5', 'col-title', tr(L, 'over').replace('{x}', B.name).replace('{y}', A.name))), list(L, c.advantages && c.advantages.b_over_a, 'i-check', 'ok'));
      cols.append(c1, c2);
      adv.append(cols);
      card.append(adv);

      // best for
      const best = h('div', 'sec');
      best.append(h('h5', 'sec-title', tr(L, 'bestFor')));
      const bc = h('div', 'cols');
      [[A, 'a'], [B, 'b']].forEach(([d, k]) => {
        const x = h('div', 'best');
        x.append(auto(h('strong', '', d.name)), auto(h('span', '', (c.best_for && c.best_for[k]) || tr(L, 'none'))));
        bc.append(x);
      });
      best.append(bc);
      card.append(best);

      // specs
      const dSpecs = h('details', 'more');
      dSpecs.append(h('summary', '', tr(L, 'specs')));
      const inner = h('div', 'inner');
      const wrap = h('div', 'table-wrap'); wrap.tabIndex = 0;
      wrap.setAttribute('role', 'region'); wrap.setAttribute('aria-label', tr(L, 'specs'));
      const table = h('table');
      const thead = h('thead'), hr = h('tr');
      [tr(L, 'spec'), A.name, B.name].forEach((x) => { const th = auto(h('th', '', x)); th.scope = 'col'; hr.append(th); });
      thead.append(hr);
      const tbody = h('tbody');
      SPECS.forEach((k) => {
        const tr1 = h('tr');
        const th = h('th', '', tr(L, 's')[k]); th.scope = 'row';
        const va = A.specs && A.specs[k], vb = B.specs && B.specs[k];
        const ca = auto(h('td', '', known(va) ? va : tr(L, 'none'))), cb = auto(h('td', '', known(vb) ? vb : tr(L, 'none')));
        const sk = SPEC_SCORE[k];
        if (sk) {
          const a = num(A.scores && A.scores[sk]), b = num(B.scores && B.scores[sk]);
          if (a !== null && b !== null && a !== b) {
            if (a > b && known(va)) ca.classList.add('best-cell');
            if (b > a && known(vb)) cb.classList.add('best-cell');
          }
        }
        tr1.append(th, ca, cb);
        tbody.append(tr1);
      });
      table.append(thead, tbody);
      wrap.append(table);
      inner.append(wrap);
      dSpecs.append(inner);
      card.append(dSpecs);

      // pros & cons
      const dPc = h('details', 'more');
      dPc.append(h('summary', '', tr(L, 'prosCons')));
      const inner2 = h('div', 'inner');
      const pc = h('div', 'cols');
      [A, B].forEach((d) => {
        const x = h('div');
        x.append(auto(h('h5', 'col-title', d.name)), list(L, d.pros, 'i-check', 'ok'));
        const cons = (d.cons || []).filter(Boolean);
        if (cons.length) { const sp = h('div'); sp.style.height = '8px'; x.append(sp, list(L, cons, 'i-x', 'no')); }
        pc.append(x);
      });
      inner2.append(pc);
      dPc.append(inner2);
      card.append(dPc);

      // verdict
      const v = h('div', 'verdict');
      const top = h('div', 'verdict-top');
      const vi = h('span', 'verdict-icon'); vi.append(ico('i-trophy', 'icon-lg'));
      const vt = h('div');
      const winName = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : tr(L, 'tie');
      vt.append(h('p', 'verdict-kicker', tr(L, 'verdict')), auto(h('p', 'verdict-name', winName)));
      top.append(vi, vt);
      v.append(top);
      if (c.verdict.reason) v.append(auto(h('p', 'verdict-reason', c.verdict.reason)));
      const foot = h('div', 'card-foot');
      if (c.disclaimer) foot.append(auto(h('p', 'disclaimer', c.disclaimer)));
      const cp = h('button', 'copy-btn');
      cp.type = 'button';
      const cpLabel = h('span', '', tr(L, 'copy'));
      cp.append(ico('i-copy', 'icon-sm'), cpLabel);
      cp.addEventListener('click', async () => {
        const ok = await copyText(summaryText(c, L));
        cpLabel.textContent = tr(L, ok ? 'copied' : 'copyFail');
        setTimeout(() => { cpLabel.textContent = tr(L, 'copy'); }, 2000);
      });
      foot.append(cp);
      v.append(foot);
      card.append(v);
      return card;
    }

    function animateBars(card) {
      const fills = card.querySelectorAll('.fill');
      requestAnimationFrame(() => requestAnimationFrame(() => fills.forEach((f) => { f.style.width = f.dataset.w + '%'; })));
    }

    function summaryText(c, L) {
      const [A, B] = c.devices;
      const w = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : tr(L, 'tie');
      const lines = ['newniom ai — ' + A.name + ' vs ' + B.name, tr(L, 'winner') + ': ' + w];
      if (c.verdict.reason) lines.push(c.verdict.reason);
      lines.push('');
      METRICS.forEach((k) => lines.push(tr(L, 'm')[k] + ': ' + fmt(L, num(A.scores[k])) + ' / ' + fmt(L, num(B.scores[k]))));
      lines.push('', location.origin + location.pathname);
      return lines.join('\n');
    }

    async function copyText(text) {
      try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      } catch (e) { return false; }
    }

    /* ---------- composer ---------- */
    function autosize() {
      el.input.style.height = 'auto';
      el.input.style.height = Math.min(el.input.scrollHeight, 140) + 'px';
    }
    el.input.addEventListener('input', autosize);
    el.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); send(el.input.value); }
    });
    el.form.addEventListener('submit', (e) => { e.preventDefault(); send(el.input.value); });

    /* ---------- chat lifecycle ---------- */
    function resetChat() {
      session++;
      history.length = 0;
      busy = false; el.send.disabled = false;
      el.stream.replaceChildren();
      const { body } = botShell();
      const bubble = h('div', 'bubble', t('welcome'));
      bubble.setAttribute('dir', 'auto'); bubble.lang = lang;
      body.append(bubble);
      showChips('start');
      el.chat.scrollTop = 0;
    }
    el.newChat.addEventListener('click', () => { resetChat(); el.input.value = ''; autosize(); if (!coarse) el.input.focus(); });

    applyChrome();
    resetChat();
  })();
  </script>
</body>
</html>
