  <style>
    :root {
      --accent: #04205F;
      --accent-light: #69D4FF;
      --text: #f5f2f7;
      --muted: #c4bdca;
      --muted-2: #96909d;
      --card: rgba(18, 17, 21, .72);
      --line: rgba(255, 255, 255, .105);
      --line-strong: rgba(255, 255, 255, .16);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: #08070b;
      font-family: Inter, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(900px 520px at 12% -10%, rgba(4,32,95,.30), transparent 60%),
        radial-gradient(720px 520px at 100% 110%, rgba(4,32,95,.20), transparent 60%);
    }
    button, textarea { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    a { color: #78d6ff; text-decoration: none; }
    a:hover { color: #fff; }
    a:focus-visible { outline: 3px solid #00A6E4; outline-offset: 3px; }
    ::selection { background: rgba(0,166,228,.42); color: #fff; }
    .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .icon-sm { width: 16px; height: 16px; }
    .icon-lg { width: 26px; height: 26px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .app { position: relative; display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 820px; margin: 0 auto; }

    /* ---- header ---- */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); background: rgba(8,7,11,.7); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .orb { display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(145deg, #07549B, #04205F); color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 6px 20px rgba(4,32,95,.4); }
    .brand-text { display: grid; line-height: 1.2; min-width: 0; }
    .brand-name { font-weight: 720; font-size: 1.02rem; letter-spacing: .02em; }
    .brand-cap { color: var(--muted-2); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tools { display: flex; align-items: center; gap: 8px; }

    /* ---- chat ---- */
    .chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 18px 14px 8px; scroll-padding-top: 12px; overscroll-behavior: contain; }
    .stream { display: flex; flex-direction: column; gap: 14px; direction: ltr; }
    .msg { display: flex; gap: 10px; max-width: 100%; }
    .msg.bot { align-self: flex-start; width: 100%; }
    .msg.user { align-self: flex-end; max-width: 88%; }
    .avatar { display: grid; place-items: center; flex: 0 0 auto; width: 30px; height: 30px; margin-top: 2px; border-radius: 10px; background: linear-gradient(145deg, #07549B, #04205F); color: #fff; }
    .bot-body { min-width: 0; flex: 1 1 auto; display: grid; gap: 10px; justify-items: start; }
    .bubble { max-width: min(100%, 620px); padding: 11px 15px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; font-size: .96rem; line-height: 1.75; }
    .bubble.err { border-color: rgba(230,160,160,.35); }
    .typing { display: inline-flex; gap: 5px; padding: 15px 16px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-light); animation: blink 1.1s ease-in-out infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg { animation: rise .3s ease both; }
    .card { animation: rise .4s ease both; }
    .retry { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; margin-top: 8px; padding: 6px 14px; border: 1px solid rgba(0,166,228,.4); border-radius: 12px; background: rgba(4,32,95,.2); color: #fff; font-weight: 600; font-size: .86rem; cursor: pointer; }
    .retry:hover { background: rgba(4,32,95,.4); }

    /* ---- comparison card ---- */
    .card { width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
    .card h4, .card h5 { margin: 0; }
    .heads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .head { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 11px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.03); }
    .thumb { display: grid; place-items: center; width: 52px; height: 52px; overflow: hidden; border-radius: 11px; background: rgba(255,255,255,.06); color: var(--accent-light); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .badge-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { display: inline-grid; place-items: center; min-width: 21px; height: 21px; padding: 0 6px; border: 1px solid rgba(0,166,228,.4); border-radius: 7px; color: #b8eaff; font-size: .68rem; font-weight: 700; }
    .win-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 7px; background: var(--accent); color: #fff; font-size: .66rem; font-weight: 650; }
    .name { margin: 3px 0 0 !important; font-size: .95rem; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; line-height: 1.35; }
    .meta { margin: 0; color: var(--muted-2); font-size: .74rem; }
    .price { display: inline-block; margin-top: 4px; padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 8px; color: #e8f6ff; font-size: .72rem; }
    .summary { grid-column: 1 / -1; margin: 2px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.7; }
    .sec { margin-top: 18px; }
    .sec-title { margin: 0 0 10px !important; color: #9bdfff; font-size: .7rem; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; }
    .legend { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 2px; color: var(--muted); font-size: .76rem; font-weight: 600; }
    .legend span { min-width: 0; overflow-wrap: anywhere; }
    .row { margin-top: 11px; }
    .row-label { margin-bottom: 4px; color: var(--muted-2); font-size: .74rem; text-align: center; }
    .bars { display: grid; grid-template-columns: 2.3em 1fr 1fr 2.3em; align-items: center; gap: 6px; }
    .num { color: var(--muted-2); font-size: .8rem; font-variant-numeric: tabular-nums; text-align: center; }
    .num.win { color: #fff; font-weight: 700; }
    .track { display: flex; height: 9px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
    .track.ta { justify-content: flex-end; }
    .track.tb { justify-content: flex-start; }
    .fill { width: 0; height: 100%; border-radius: 999px; background: rgba(255,255,255,.26); transition: width .6s ease; }
    .fill.win { background: var(--accent-light); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .col-title { margin: 0 0 8px !important; font-size: .86rem; font-weight: 650; overflow-wrap: anywhere; }
    .list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .list li { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: .82rem; line-height: 1.65; }
    .list .icon { margin-top: 3px; }
    .ok { color: #b9e2c4; }
    .no { color: #e6b3b3; }
    .empty { margin: 0; color: var(--muted-2); font-size: .82rem; }
    .best { padding: 12px 13px; border-top: 1px solid rgba(0,166,228,.42); background: rgba(255,255,255,.025); }
    .best strong { display: block; margin-bottom: 4px; font-size: .86rem; overflow-wrap: anywhere; }
    .best span { color: var(--muted); font-size: .82rem; line-height: 1.7; }
    details.more { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.025); }
    details.more summary { display: flex; align-items: center; min-height: 44px; padding: 0 14px; color: #9bdfff; font-size: .7rem; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; }
    details.more .inner { padding: 0 14px 14px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: .8rem; }
    th, td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
    thead th { background: rgba(255,255,255,.04); color: #e8f6ff; }
    tbody th { color: var(--muted-2); font-weight: 600; white-space: nowrap; }
    tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
    td.best-cell { background: rgba(4,32,95,.26); color: #fff; font-weight: 650; }
    .verdict { margin-top: 18px; padding: 15px; border: 1px solid rgba(0,166,228,.4); border-radius: 16px; background: linear-gradient(135deg, rgba(4,32,95,.24), rgba(4,32,95,.06)); }
    .verdict-top { display: flex; align-items: center; gap: 12px; }
    .verdict-icon { display: grid; place-items: center; flex: 0 0 auto; width: 42px; height: 42px; border: 1px solid rgba(0,166,228,.3); border-radius: 13px; background: rgba(4,32,95,.25); color: #e8d3f5; }
    .verdict-kicker { margin: 0 !important; color: #9bdfff; font-size: .68rem; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; }
    .verdict-name { margin: 1px 0 0 !important; font-size: 1.12rem; font-weight: 660; overflow-wrap: anywhere; }
    .verdict-reason { margin: 11px 0 0; color: #ddd5e4; font-size: .88rem; line-height: 1.8; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .disclaimer { flex: 1 1 220px; margin: 0; color: var(--muted-2); font-size: .72rem; line-height: 1.65; }
    .copy-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: rgba(255,255,255,.06); color: #f3edf7; font-size: .82rem; font-weight: 600; cursor: pointer; }
    .copy-btn:hover { background: rgba(255,255,255,.12); }

    /* ---- composer (floating over chat) ---- */
    .chips { display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips:empty { display: none; }
    .chip { flex: 0 0 auto; min-height: 38px; padding: 8px 16px; border: 1px solid var(--line-strong); border-radius: 999px; background: rgba(255,255,255,.05); color: #e8f6ff; font-size: .8rem; cursor: pointer; white-space: nowrap; }
    .chip:hover { background: rgba(255,255,255,.11); border-color: rgba(0,166,228,.4); }
    .compose { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 14px; border: 1px solid var(--line-strong); border-radius: 18px; background: rgba(22,20,27,.92); }
    .compose textarea { flex: 1 1 auto; min-width: 0; max-height: 140px; padding: 9px 0; border: 0; outline: none; resize: none; background: transparent; font-size: 1rem; line-height: 1.5; color: var(--text); }
    .compose textarea::placeholder { color: var(--muted-2); }
    .send { display: grid; place-items: center; flex: 0 0 auto; width: 44px; height: 44px; border: 0; border-radius: 13px; background: var(--accent); color: #fff; cursor: pointer; transition: background .18s ease, opacity .18s ease; }
    .send:hover { background: #07549B; }
    .send:disabled { opacity: .45; cursor: not-allowed; }
    .note { margin: 8px 4px 0; color: var(--muted-2); font-size: .7rem; text-align: center; line-height: 1.5; }

    /* ---- Newniom AI: restrained cosmic glass ---- */
    :root {
      --accent:#00A6E4;
      --accent-light:#69D4FF;
      --space-blue:#04205F;
      --space-plum:#6D1F6B;
      --space-cyan:#00A6E4;
      --glass:rgba(8,18,43,.60);
      --glass-edge:rgba(164,211,255,.20);
      --card:rgba(7,18,43,.70);
      --line:rgba(172,211,255,.13);
      --line-strong:rgba(172,211,255,.22);
    }
    body {
      background:
        radial-gradient(ellipse 70% 52% at 4% 0%, rgba(4,32,95,.78), transparent 72%),
        radial-gradient(ellipse 58% 54% at 100% 38%, rgba(109,31,107,.38), transparent 72%),
        radial-gradient(ellipse 62% 48% at 50% 100%, rgba(0,166,228,.17), transparent 72%),
        #030712;
    }
    body::before {
      inset:-12%; opacity:.76; filter:blur(34px);
      background:
        radial-gradient(ellipse 34% 28% at 20% 24%, rgba(0,166,228,.15), transparent 75%),
        radial-gradient(ellipse 34% 32% at 76% 70%, rgba(109,31,107,.20), transparent 75%),
        radial-gradient(ellipse 24% 24% at 54% 14%, rgba(4,32,95,.24), transparent 75%);
      animation:cosmicDrift 24s ease-in-out infinite alternate;
    }
    @keyframes cosmicDrift { from{transform:translate3d(-1%,0,0) scale(1)} to{transform:translate3d(1.5%,-1%,0) scale(1.06)} }
    .app { max-width:900px; padding-left:0; isolation:isolate; }

    .top-actions {
      position:absolute; z-index:40; top:calc(10px + env(safe-area-inset-top,0px)); right:13px;
      display:flex; align-items:center;
    }
    .menu-trigger {
      display:grid; place-items:center; width:44px; height:44px; padding:0;
      border:1px solid rgba(185,220,255,.22); border-radius:50%;
      color:#eaf7ff; background:rgba(8,20,47,.48);
      -webkit-backdrop-filter:blur(22px) saturate(145%); backdrop-filter:blur(22px) saturate(145%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.22);
      cursor:pointer; transition:background .18s ease,transform .18s ease,border-color .18s ease;
    }
    .menu-trigger:active { transform:scale(.94); background:rgba(20,55,95,.72); }
    .menu-trigger .dots { display:flex; gap:3px; }
    .menu-trigger .dots i { width:4px;height:4px;border-radius:50%;background:currentColor; }

    .menu-trigger.is-morphing .dots {
      animation: dotsMorph .42s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes dotsMorph {
      0%   { transform: rotate(0deg)   scale(1);   opacity: 1; }
      55%  { transform: rotate(200deg) scale(.7);  opacity: .85; }
      100% { transform: rotate(360deg) scale(0);   opacity: 0; }
    }

    /* Chat area with top & bottom fade (mask stays fixed regardless of scroll) */
    .chat {
      padding:68px 15px 12px;
      -webkit-mask-image: linear-gradient(to bottom,
        transparent 0,
        #000 100px,
        #000 calc(90% - 55px),
        transparent 100%);
      mask-image: linear-gradient(to bottom,
        transparent 0,
        #000 100px,
        #000 calc(90% - 55px),
        transparent 100%);
    }
    .stream { gap:17px; }
    .msg.user { max-width:90%; }
    .avatar { display:none; }
    .bot-body { gap:11px; }
    .bot .bubble {
      border:1px solid rgba(173,214,255,.16); border-radius:19px 19px 19px 6px;
      background:rgba(7,19,43,.63); -webkit-backdrop-filter:blur(20px) saturate(140%);
      backdrop-filter:blur(20px) saturate(140%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 32px rgba(0,0,0,.17);
    }
    .user .bubble {
      border:1px solid rgba(80,194,244,.24); border-radius:19px 19px 6px 19px;
      background:linear-gradient(135deg,rgba(4,32,95,.94),rgba(0,105,155,.88));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,28,70,.22);
    }
    .chip {
      border-radius:999px; border-color:rgba(151,203,246,.18); background:rgba(8,24,53,.54);
      -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
      transition:transform .16s ease,background .16s ease,border-color .16s ease;
    }
    .chip:active { transform:scale(.97); background:rgba(4,32,95,.65); }
    .compose {
      align-items:flex-end; gap:8px; padding:6px 7px 6px 14px; border-radius:20px;
      border:1px solid rgba(168,211,255,.22); background:rgba(8,21,46,.72);
      -webkit-backdrop-filter:blur(23px) saturate(145%); backdrop-filter:blur(23px) saturate(145%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.24);
      transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;
    }
    .compose textarea { padding:10px 0; }
    .send {
      width:42px;height:42px;border-radius:14px;
      background:linear-gradient(145deg,#00A6E4,#07549B);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 5px 15px rgba(0,83,145,.28);
      transition:transform .16s ease,filter .16s ease;
    }
    .send:active { transform:scale(.94); }
    .typing {
      position:relative; overflow:hidden; min-width:74px; min-height:42px; align-items:center;
      border:1px solid rgba(0,166,228,.25); border-radius:16px;
      background:rgba(5,20,48,.72); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    }
    .typing::before {
      content:""; position:absolute; inset:-90% -45%;
      background:linear-gradient(105deg,transparent 28%,rgba(0,166,228,.04) 40%,rgba(0,166,228,.34) 49%,rgba(109,31,107,.30) 56%,transparent 70%);
      transform:translateX(-58%) rotate(8deg); animation:thinkingGlow 2.8s ease-in-out infinite;
    }
    .typing i { position:relative;z-index:1;background:#83dcff;box-shadow:0 0 10px rgba(0,166,228,.58); }
    @keyframes thinkingGlow { 0%{transform:translateX(-58%) rotate(8deg)} 100%{transform:translateX(58%) rotate(8deg)} }
    .thinking-aura { position:fixed; z-index:-1; inset:-20%; pointer-events:none; opacity:0; transition:opacity .5s ease;
      background:radial-gradient(ellipse 32% 26% at 50% 48%,rgba(0,166,228,.15),transparent 72%),radial-gradient(ellipse 28% 25% at 68% 62%,rgba(109,31,107,.17),transparent 72%); filter:blur(26px); }
    body.is-thinking .thinking-aura { opacity:1; animation:thinkingFloat 5s ease-in-out infinite alternate; }
    @keyframes thinkingFloat { from{transform:translate(-2%,1%) scale(.96)} to{transform:translate(2%,-1%) scale(1.08)} }
    .history-panel {
      position:absolute; top:54px; right:0; width:min(310px,calc(100vw - 82px)); max-height:min(62vh,460px);
      overflow:hidden; border:1px solid rgba(165,211,255,.20); border-radius:18px;
      background:rgba(5,16,39,.88); -webkit-backdrop-filter:blur(28px) saturate(145%);
      backdrop-filter:blur(28px) saturate(145%); box-shadow:0 18px 50px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.10);
    }
    .history-head { display:flex;justify-content:space-between;align-items:center;padding:13px 15px 10px;color:#e8f6ff;font-size:.88rem;font-weight:650; }
    .history-close { border:0;background:transparent;color:#b8d9ef;font-size:23px;line-height:1;cursor:pointer; outline: none; }
    .history-list { display:grid;gap:4px;max-height:calc(min(62vh,460px) - 48px);overflow:auto;padding:0 8px 9px; }
    .history-item { width:100%;display:block;text-align:start;padding:10px 14px;border:1px solid transparent;border-radius:999px;background:transparent;color:#eff8ff;cursor:pointer; }
    .history-item:active,.history-item:hover { background:rgba(0,166,228,.10);border-color:rgba(0,166,228,.14); }
    .history-item strong { display:block;font-size:.83rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .history-item small { display:block;margin-top:3px;color:#91a9bf;font-size:.7rem; }
    .history-empty { padding:14px;color:#91a9bf;font-size:.8rem;text-align:center; }

    .action-menu {

  <script>
  (() => {

    const WORKER_URL = 'https://newniom-compare.newniom-com.workers.dev';

    document.addEventListener('dblclick', (event) => event.preventDefault(), { passive: false });

    const I18N = {
      en: {

        verdict: 'Verdict', spec: 'Spec', winner: 'Winner', tie: "It's a tie", over: '{x} over {y}',
        copy: 'Copy summary', copied: 'Copied', copyFail: 'Copy failed', none: '—',

    const h = (tag, cls, txt) => {

    const num = (v) => { const n = typeof v === 'string' ? parseFloat(v) : v; return typeof n === 'number' && isFinite(n) ? Math.max(0, Math.min(10, n)) : null; };
    const fmt = (n) => (n === null ? t('none') : String(Math.round(n * 10) / 10));

    const toBottom = () => { el.chat.scrollTo({ top: el.chat.scrollHeight, behavior: reduceMotion ? 'auto' : 'smooth' }); };

      const item = { id: currentChatId, title, updated: Date.now(), messages: chatLog.slice(-80) };
      savedChats = [item, ...savedChats.filter(x => x.id !== currentChatId)].slice(0,30);
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(savedChats)); } catch (e) {}
      renderHistory();
    }
    function renderHistory() {
      if (!el.historyList) return;

      savedChats.forEach(item => {
        const b = h('button','history-item');

      const item = savedChats.find(x => x.id === id);

      for (const msg of chatLog) {
        if (msg.role === 'user') { addUser(msg.content); apiHistory.push({role:'user',content:msg.content}); }
        else if (msg.role === 'assistant') {
          apiHistory.push({role:'assistant',content:msg.comparison ? compact({reply:msg.content,comparison:msg.comparison}) : msg.content});
          await addBot(msg.content, msg.comparison ? (body) => body.append(buildCard(msg.comparison)) : null);
        }
      }
      history.push(...apiHistory.slice(-10));
      if (!chatLog.length) resetChat();
      el.historyPanel.hidden = true; el.historyToggle.setAttribute('aria-expanded','false'); toggleMenu(false);
      toBottom();
    }

    /* ---------- iOS-style morphing menu ---------- */
    function toggleMenu(force) {
      const open = typeof force === 'boolean' ? force : el.actionMenu.hidden;
      el.menuToggle.setAttribute('aria-expanded', String(open));
      if (open) {
        el.actionMenu.hidden = false;
        el.actionMenu.classList.remove('is-opening');
        void el.actionMenu.offsetWidth;
        el.actionMenu.classList.add('is-opening');
        el.menuToggle.classList.remove('is-morphing');
        void el.menuToggle.offsetWidth;
        el.menuToggle.classList.add('is-morphing');
      } else {
        el.actionMenu.hidden = true;
        el.actionMenu.classList.remove('is-opening');
        el.menuToggle.classList.remove('is-morphing');
      }
    }
    function toggleHistory(force) {
      const open = typeof force === 'boolean' ? force : el.historyPanel.hidden;
      el.historyPanel.hidden = !open;
      el.historyToggle.setAttribute('aria-expanded',String(open));
      if (open) renderHistory();
    }

    /* ---------- chips ---------- */
    let chipMode = 'start';
    function showChips(mode) {
      chipMode = mode;
      el.chips.replaceChildren();
      const items = mode === 'start'
        ? STARTERS.map(([a, b]) => ({ label: a + ' vs ' + b, text: t('cmpText').replace('{a}', a).replace('{b}', b) }))
        : t('follow').map((x) => ({ label: x, text: x }));
      items.forEach((it) => {
        const b = h('button', 'chip', it.label);
        b.type = 'button';
        b.addEventListener('click', () => send(it.text));
        el.chips.append(b);
      });
    }
    const hideChips = () => el.chips.replaceChildren();

    /* ---------- messages ---------- */
    function addUser(text) {
      const m = h('div', 'msg user');
      m.append(auto(h('div', 'bubble', text)));
      el.stream.append(m);
      toBottom();
    }

    function botShell() {
      const m = h('div', 'msg bot');
      const av = h('span', 'avatar'); av.append(ico('i-spark', 'icon-sm'));
      const body = h('div', 'bot-body');
      m.append(av, body);
      el.stream.append(m);
      return { m, body };
    }

    function addTyping() {
      const { m, body } = botShell();
      const b = h('div', 'bubble typing');
      b.setAttribute('aria-hidden', 'true');
      b.append(h('i'), h('i'), h('i'));
      body.append(b);
      toBottom();
      return m;
    }

    function typeInto(node, text) {
      return new Promise((resolve) => {
        if (reduceMotion || text.length < 8) { node.textContent = text; return resolve(); }
        const step = Math.max(1, Math.ceil(text.length / 70));
        let i = 0;
        const tick = () => {
          i = Math.min(text.length, i + step);
          node.textContent = text.slice(0, i);
          if (nearBottom()) el.chat.scrollTop = el.chat.scrollHeight;
          if (i < text.length) setTimeout(tick, 22); else resolve();
        };
        tick();
      });
    }

    async function addBot(text, extraBuilder) {
      const { m, body } = botShell();
      const bubble = h('div', 'bubble');
      bubble.setAttribute('dir', 'auto');
      bubble.lang = L;
      const live = h('span', 'sr', text);
      const vis = h('span');
      vis.setAttribute('aria-hidden', 'true');
      bubble.append(vis, live);
      body.append(bubble);
      toBottom();
      await typeInto(vis, text);
      if (extraBuilder) extraBuilder(body, m);
      return m;
    }

    function addError(code) {
      const map = { rate_limited: 'errRate', quota_exceeded: 'errQuota', bad_input: 'errBad', bad_request: 'errBad', timeout: 'errTimeout', network: 'errNetwork' };
      const { m, body } = botShell();
      const b = h('div', 'bubble err', t(map[code] || 'errServer'));
      b.setAttribute('dir', 'auto');
      body.append(b);
      const btn = h('button', 'retry');
      btn.type = 'button';
      btn.append(ico('i-retry', 'icon-sm'), h('span', '', t('retry')));
      btn.addEventListener('click', () => { m.remove(); ask(); });
      body.append(btn);
      toBottom();
    }

    /* ---------- worker call ---------- */
    async function callChat(messages) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 55000);
      let res;
      try {
        res = await fetch(WORKER_URL.replace(/\/+$/, '') + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lang: L, messages }),
          signal: ctrl.signal,
        });
      } catch (e) {
        throw { code: e && e.name === 'AbortError' ? 'timeout' : 'network' };
      } finally { clearTimeout(timer); }
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok || !data) throw { code: (data && data.error) || 'server' };
      return data;
    }

    function compact(data) {
      let s = data.reply;
      const c = data.comparison;
      if (c) {
        const [A, B] = c.devices;
        const w = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : 'tie';
        const sc = METRICS.map((k) => k + ' ' + fmt(num(A.scores[k])) + '/' + fmt(num(B.scores[k]))).join(', ');
        s += '\n[comparison card shown: ' + A.name + ' vs ' + B.name + '; winner: ' + w + '; scores ' + sc + ']';
      }
      return s.slice(0, 850);
    }

    function send(text) {
      text = String(text || '').replace(/[ \t]+\n/g, '\n').trim().slice(0, MAX_CHARS);
      if (!text || busy) return;
      hideChips();
      addUser(text);
      history.push({ role: 'user', content: text });
      chatLog.push({ role:'user', content:text });
      persistChat();
      el.input.value = '';
      autosize();
      syncChatPadding();
      ask();
    }

    async function ask() {
      const mine = session;
      busy = true; document.body.classList.add('is-thinking'); el.send.disabled = true;
      const typing = addTyping();
      try {
        const data = await callChat(history.slice(-10));
        if (mine !== session) return;
        typing.remove();
        history.push({ role: 'assistant', content: compact(data) });
        chatLog.push({ role:'assistant', content:data.reply, comparison:data.comparison || null });
        persistChat();
        await addBot(data.reply, data.comparison ? (body, m) => {
          const card = buildCard(data.comparison);
          body.append(card);
          animateBars(card);
          showChips('follow');
          if (!reduceMotion) m.scrollIntoView({ block: 'start', behavior: 'smooth' }); else m.scrollIntoView({ block: 'start' });
        } : null);
        if (!data.comparison && history.some((x) => x.content.indexOf('[comparison card shown') !== -1)) showChips('follow');
      } catch (err) {
        if (mine !== session) return;
        typing.remove();
        addError(err && err.code);
      } finally {
        if (mine === session) { busy = false; document.body.classList.remove('is-thinking'); el.send.disabled = false; if (!coarse) el.input.focus(); }
        syncChatPadding();
      }
    }

    /* ---------- images (Wikipedia) ---------- */
    const imgCache = new Map();
    function wikiImage(name) {
      if (imgCache.has(name)) return imgCache.get(name);
      const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=200&gsrsearch=' + encodeURIComponent(name);
      const p = fetch(u).then((r) => r.json()).then((j) => {
        const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
        pages.sort((x, y) => (x.index || 0) - (y.index || 0));
        const hit = pages.find((pg) => pg.thumbnail && pg.thumbnail.source);
        if (!hit) return null;
        try { return /(^|\.)wikimedia\.org$/.test(new URL(hit.thumbnail.source).hostname) ? hit.thumbnail.source : null; } catch (e) { return null; }
      }).catch(() => null);
      imgCache.set(name, p);
      return p;
    }
    function iconFor(d, category) {
      const map = { phone: 'phone', laptop: 'laptop', tablet: 'tablet', computer: 'desktop' };
      if (map[category]) return 'i-' + map[category];
      const n = String(d.name || '').toLowerCase();
      if (/iphone|galaxy s|galaxy z|pixel|phone|redmi|poco|oneplus|xperia/.test(n)) return 'i-phone';
      if (/ipad|tab |tablet|matepad/.test(n)) return 'i-tablet';
      if (/macbook|laptop|thinkpad|zenbook|xps|legion|zephyrus|ideapad|vivobook|inspiron|spectre/.test(n)) return 'i-laptop';
      if (/imac|mac mini|mac studio|mac pro|desktop|tower|optiplex|all-in-one|nuc/.test(n)) return 'i-desktop';
      return 'i-cpu';
    }

    /* ---------- comparison card ---------- */
    function list(items, iconId, cls) {
      const arr = Array.isArray(items) ? items.filter(Boolean) : [];
      if (!arr.length) return auto(h('p', 'empty', t('none')));
      const ul = h('ul', 'list');
      arr.forEach((s) => { const li = h('li'); li.append(ico(iconId, 'icon-sm ' + cls), auto(h('span', '', s))); ul.append(li); });
      return ul;
    }

    function headCard(d, letter, c) {
      const box = h('div', 'head');
      const th = h('div', 'thumb'); th.append(ico(iconFor(d, c.category), 'icon-lg'));
      const body = h('div');
      const row = h('div', 'badge-row');
      row.append(h('span', 'badge', letter.toUpperCase()));
      if (c.verdict.winner === letter) { const w = h('span', 'win-chip'); w.append(ico('i-trophy', 'icon-sm'), h('span', '', t('winner'))); row.append(w); }
      body.append(row, auto(h('h4', 'name', d.name)));
      const meta = [d.brand, d.year].filter(known).join(' · ');
      if (meta) body.append(auto(h('p', 'meta', meta)));
      if (known(d.price_range)) body.append(auto(h('span', 'price', d.price_range)));
      box.append(th, body, auto(h('p', 'summary', d.summary || '')));
      wikiImage(d.name).then((src) => {
        if (!src || !th.isConnected) return;
        const img = document.createElement('img');
        img.loading = 'lazy'; img.decoding = 'async'; img.alt = d.name; img.referrerPolicy = 'no-referrer';
        img.addEventListener('load', () => th.replaceChildren(img));
        img.src = src;
      });
      return box;
    }

    function buildCard(c) {
      const [A, B] = c.devices;
      const card = h('section', 'card');
      card.setAttribute('dir', 'ltr');
      card.lang = L;

      const heads = h('div', 'heads');
      heads.append(headCard(A, 'a', c), headCard(B, 'b', c));
      card.append(heads);

      // scores
      const sc = h('div', 'sec');
      sc.append(h('h5', 'sec-title', t('scores')));
      const legend = h('div', 'legend');
      legend.append(auto(h('span', '', A.name)), auto(h('span', '', B.name)));
      sc.append(legend);
      METRICS.forEach((k) => {
        const a = num(A.scores && A.scores[k]), b = num(B.scores && B.scores[k]);
        const aw = a !== null && b !== null && a > b, bw = a !== null && b !== null && b > a;
        const row = h('div', 'row');
        row.setAttribute('role', 'group');
        row.setAttribute('aria-label', t('m')[k] + ': ' + A.name + ' ' + fmt(a) + ', ' + B.name + ' ' + fmt(b));
        row.append(h('div', 'row-label', t('m')[k]));
        const bars = h('div', 'bars');
        const ta = h('div', 'track ta'), tb = h('div', 'track tb');
        const fa = h('div', 'fill' + (aw ? ' win' : '')), fb = h('div', 'fill' + (bw ? ' win' : ''));
        fa.dataset.w = a === null ? 0 : a * 10; fb.dataset.w = b === null ? 0 : b * 10;
        ta.append(fa); tb.append(fb);
        bars.append(h('span', 'num' + (aw ? ' win' : ''), fmt(a)), ta, tb, h('span', 'num' + (bw ? ' win' : ''), fmt(b)));
        row.append(bars);
        sc.append(row);
      });
      card.append(sc);

      // advantages
      const adv = h('div', 'sec');
      adv.append(h('h5', 'sec-title', t('advantages')));
      const cols = h('div', 'cols');
      const c1 = h('div'), c2 = h('div');
      c1.append(auto(h('h5', 'col-title', t('over').replace('{x}', A.name).replace('{y}', B.name))), list(c.advantages && c.advantages.a_over_b, 'i-check', 'ok'));
      c2.append(auto(h('h5', 'col-title', t('over').replace('{x}', B.name).replace('{y}', A.name))), list(c.advantages && c.advantages.b_over_a, 'i-check', 'ok'));
      cols.append(c1, c2);
      adv.append(cols);
      card.append(adv);

      // best for
      const best = h('div', 'sec');
      best.append(h('h5', 'sec-title', t('bestFor')));
      const bc = h('div', 'cols');
      [[A, 'a'], [B, 'b']].forEach(([d, k]) => {
        const x = h('div', 'best');
        x.append(auto(h('strong', '', d.name)), auto(h('span', '', (c.best_for && c.best_for[k]) || t('none'))));
        bc.append(x);
      });
      best.append(bc);
      card.append(best);

      // specs
      const dSpecs = h('details', 'more');
      dSpecs.append(h('summary', '', t('specs')));
      const inner = h('div', 'inner');
      const wrap = h('div', 'table-wrap'); wrap.tabIndex = 0;
      wrap.setAttribute('role', 'region'); wrap.setAttribute('aria-label', t('specs'));
      const table = h('table');
      const thead = h('thead'), hr = h('tr');
      [t('spec'), A.name, B.name].forEach((x) => { const th = auto(h('th', '', x)); th.scope = 'col'; hr.append(th); });
      thead.append(hr);
      const tbody = h('tbody');
      SPECS.forEach((k) => {
        const tr1 = h('tr');
        const th = h('th', '', t('s')[k]); th.scope = 'row';
        const va = A.specs && A.specs[k], vb = B.specs && B.specs[k];
        const ca = auto(h('td', '', known(va) ? va : t('none'))), cb = auto(h('td', '', known(vb) ? vb : t('none')));
        const sk = SPEC_SCORE[k];
        if (sk) {
          const a = num(A.scores && A.scores[sk]), b = num(B.scores && B.scores[sk]);
          if (a !== null && b !== null && a !== b) {
            if (a > b && known(va)) ca.classList.add('best-cell');
            if (b > a && known(vb)) cb.classList.add('best-cell');
          }
        }
        tr1.append(th, ca, cb);
        tbody.append(tr1);
      });
      table.append(thead, tbody);
      wrap.append(table);
      inner.append(wrap);
      dSpecs.append(inner);
      card.append(dSpecs);

      // pros & cons
      const dPc = h('details', 'more');
      dPc.append(h('summary', '', t('prosCons')));
      const inner2 = h('div', 'inner');
      const pc = h('div', 'cols');
      [A, B].forEach((d) => {
        const x = h('div');
        x.append(auto(h('h5', 'col-title', d.name)), list(d.pros, 'i-check', 'ok'));
        const cons = (d.cons || []).filter(Boolean);
        if (cons.length) { const sp = h('div'); sp.style.height = '8px'; x.append(sp, list(cons, 'i-x', 'no')); }
        pc.append(x);
      });
      inner2.append(pc);
      dPc.append(inner2);
      card.append(dPc);

      // verdict
      const v = h('div', 'verdict');
      const top = h('div', 'verdict-top');
      const vi = h('span', 'verdict-icon'); vi.append(ico('i-trophy', 'icon-lg'));
      const vt = h('div');
      const winName = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : t('tie');
      vt.append(h('p', 'verdict-kicker', t('verdict')), auto(h('p', 'verdict-name', winName)));
      top.append(vi, vt);
      v.append(top);
      if (c.verdict.reason) v.append(auto(h('p', 'verdict-reason', c.verdict.reason)));
      const foot = h('div', 'card-foot');
      if (c.disclaimer) foot.append(auto(h('p', 'disclaimer', c.disclaimer)));
      const cp = h('button', 'copy-btn');
      cp.type = 'button';
      const cpLabel = h('span', '', t('copy'));
      cp.append(ico('i-copy', 'icon-sm'), cpLabel);
      cp.addEventListener('click', async () => {
        const ok = await copyText(summaryText(c));
        cpLabel.textContent = ok ? t('copied') : t('copyFail');
        setTimeout(() => { cpLabel.textContent = t('copy'); }, 2000);
      });
      foot.append(cp);
      v.append(foot);
      card.append(v);
      return card;
    }

    function animateBars(card) {
      const fills = card.querySelectorAll('.fill');
      requestAnimationFrame(() => requestAnimationFrame(() => fills.forEach((f) => { f.style.width = f.dataset.w + '%'; })));
    }

    function summaryText(c) {
      const [A, B] = c.devices;
      const w = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : t('tie');
      const lines = ['newniom ai — ' + A.name + ' vs ' + B.name, t('winner') + ': ' + w];
      if (c.verdict.reason) lines.push(c.verdict.reason);
      lines.push('');
      METRICS.forEach((k) => lines.push(t('m')[k] + ': ' + fmt(num(A.scores[k])) + ' / ' + fmt(num(B.scores[k]))));
      lines.push('', location.origin + location.pathname);
      return lines.join('\n');
    }

    async function copyText(text) {
      try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      } catch (e) { return false; }
    }

    /* ---------- composer ---------- */
    function autosize() {
      el.input.style.height = 'auto';
      el.input.style.height = Math.min(el.input.scrollHeight, 140) + 'px';
      syncChatPadding();
    }
    el.input.addEventListener('input', autosize);
    el.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); send(el.input.value); }
    });
    el.form.addEventListener('submit', (e) => { e.preventDefault(); send(el.input.value); });

    /* ---------- chat lifecycle ---------- */
    function resetChat() {
      session++;
      history.length = 0;
      chatLog = [];
      busy = false; document.body.classList.remove('is-thinking'); el.send.disabled = false;
      el.stream.replaceChildren();
      const { body } = botShell();
      const bubble = h('div', 'bubble', t('welcome'));
      bubble.setAttribute('dir', 'auto'); bubble.lang = L;
      body.append(bubble);
      showChips('start');
      el.chat.scrollTop = 0;
      syncChatPadding();
    }
    el.menuToggle.addEventListener('click', () => toggleMenu());
    el.newChat.addEventListener('click', () => {
      persistChat();
      currentChatId = String(Date.now()) + '-' + Math.random().toString(36).slice(2,7);
      resetChat(); toggleMenu(false); toggleHistory(false); el.input.value = ''; autosize(); if (!coarse) el.input.focus();
    });
    el.historyToggle.addEventListener('click', () => { toggleMenu(false); toggleHistory(); });
    el.historyClose.addEventListener('click', () => toggleHistory(false));
    document.addEventListener('click', (e) => {
      if (!el.actionMenu.hidden && !el.actionMenu.contains(e.target) && !el.menuToggle.contains(e.target)) toggleMenu(false);
      if (!el.historyPanel.hidden && !el.historyPanel.contains(e.target) && !el.historyToggle.contains(e.target) && !el.menuToggle.contains(e.target)) toggleHistory(false);
    });

    renderHistory();
    resetChat();
  })();
  </script>
  <script>
(function () {
  // ---- Icon (SVG with gradient, same star as favicon) ----
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>" +
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
    "<stop offset='0' stop-color='#00A6E4'/>" +
    "<stop offset='.5' stop-color='#6D1F6B'/>" +
    "<stop offset='1' stop-color='#04205F'/>" +
    "</linearGradient></defs>" +
    "<rect width='512' height='512' rx='120' fill='url(#g)'/>" +
    "<path d='M256 112l40 104 104 40-104 40-40 104-40-104-104-40 104-40 40-104Z' fill='white'/>" +
    "</svg>";
  const iconURI = 'data:image/svg+xml,' + encodeURIComponent(svg);

  // ---- Manifest ----
  const manifest = {
    name: 'newniom ai',
    short_name: 'newniom ai',
    description: 'Device comparison assistant',
    start_url: location.href.split('?')[0].split('#')[0],
    scope: location.href.substring(0, location.href.lastIndexOf('/') + 1),
    display: 'standalone',
    orientation: 'portrait-primary',
    background_color: '#030817',
    theme_color: '#030817',
    icons: [
      { src: iconURI, sizes: 'any', type: 'image/svg+xml', purpose: 'any' },
      { src: iconURI, sizes: 'any', type: 'image/svg+xml', purpose: 'maskable' }
    ]
  };
  const mfURL = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  const mfLink = document.createElement('link');
  mfLink.rel = 'manifest';
  mfLink.href = mfURL;
  document.head.appendChild(mfLink);

  // ---- iOS apple-touch-icon fallback (SVG) ----
  const ati = document.createElement('link');
  ati.rel = 'apple-touch-icon';
  ati.href = iconURI;
  document.head.appendChild(ati);

  // ---- Install prompt handling ----
  const btn = document.getElementById('installApp');
  let deferred = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    if (btn) btn.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    deferred = null;
    if (btn) btn.hidden = true;
  });

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  if (btn && !isStandalone) {
    btn.hidden = false;
    btn.addEventListener('click', async () => {
      // close the action menu first
      const menu = document.getElementById('actionMenu');
      if (menu) menu.hidden = true;
      const trigger = document.getElementById('menuToggle');
      if (trigger) trigger.setAttribute('aria-expanded', 'false');

      if (isIOS) {
        alert('To install:\n1. Tap the Share button\n2. Choose "Add to Home Screen"');
        return;
      }
      if (deferred) {
        deferred.prompt();
        try { await deferred.userChoice; } catch (e) {}
        deferred = null;
        btn.hidden = true;
        return;
      }
      alert('To install: open your browser menu and choose "Install app" or "Add to Home screen".');
    });
  }
})();
</script>
