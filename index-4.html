<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#06050c">
  <meta name="format-detection" content="telephone=no">
  <title>newniom ai</title>
  <meta name="description" content="newniom ai is an AI built by Newniom. Chat with it and compare any two phones, laptops, tablets or computers.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237030A0'/%3E%3Cpath d='M32 14l5 13 13 5-13 5-5 13-5-13-13-5 13-5 5-13Z' fill='white'/%3E%3C/svg%3E">

  <style>
    :root {
      --accent: #7030A0;
      --accent-light: #c49be0;
      --text: #f6f2f9;
      --muted: #cbc4d2;
      --muted-2: #9a94a3;
      --line: rgba(255, 255, 255, .13);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      color: var(--text);
      background: #06050c;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", Roboto, Tahoma, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button, textarea { font: inherit; color: inherit; }
    button { touch-action: manipulation; }
    :focus-visible { outline: 3px solid #c49be0; outline-offset: 3px; }
    ::selection { background: rgba(112,48,160,.5); color: #fff; }
    [hidden] { display: none !important; }
    .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .icon-sm { width: 16px; height: 16px; }
    .icon-lg { width: 26px; height: 26px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ===== Background (idle glow + "thinking" flow) ===== */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: radial-gradient(120% 80% at 50% 0%, #120a22 0%, #06050c 60%); }
    .bg i { position: absolute; border-radius: 50%; will-change: transform; }
    .b1 { width: 85vmax; height: 85vmax; left: -35vmax; top: -30vmax; background: radial-gradient(circle closest-side, rgba(112,48,160,.62), rgba(0,0,0,0) 100%); animation: drift1 28s ease-in-out infinite alternate; }
    .b2 { width: 75vmax; height: 75vmax; right: -30vmax; bottom: -28vmax; background: radial-gradient(circle closest-side, rgba(58,34,170,.55), rgba(0,0,0,0) 100%); animation: drift2 34s ease-in-out infinite alternate; }
    .b3 { width: 55vmax; height: 55vmax; left: 15%; top: 38%; background: radial-gradient(circle closest-side, rgba(176,64,196,.30), rgba(0,0,0,0) 100%); animation: drift3 40s ease-in-out infinite alternate; }
    .orbit { position: absolute; inset: -35%; opacity: 0; transition: opacity 1s ease; animation: spin 16s linear infinite; animation-play-state: paused; will-change: transform, opacity; }
    .orbit i { width: 62%; height: 62%; }
    .orbit i:nth-child(1) { left: 0; top: 4%; background: radial-gradient(circle closest-side, rgba(140,70,235,.80), rgba(0,0,0,0) 100%); }
    .orbit i:nth-child(2) { right: 0; top: 30%; background: radial-gradient(circle closest-side, rgba(50,70,235,.70), rgba(0,0,0,0) 100%); }
    .orbit i:nth-child(3) { left: 22%; bottom: 0; background: radial-gradient(circle closest-side, rgba(225,80,200,.62), rgba(0,0,0,0) 100%); }
    body.thinking .orbit { opacity: 1; animation-play-state: running; }
    @keyframes drift1 { to { transform: translate3d(14vmax, 10vmax, 0) scale(1.08); } }
    @keyframes drift2 { to { transform: translate3d(-12vmax, -9vmax, 0) scale(1.1); } }
    @keyframes drift3 { to { transform: translate3d(-8vmax, 8vmax, 0) scale(.92); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }
    body.lite .b1, body.lite .b2, body.lite .b3, body.lite .orbit { animation: none; }
    body.lite .lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; background-color: rgba(34,28,46,.82) !important; }

    /* ===== Liquid glass ===== */
    .lg {
      position: relative;
      background: rgba(255,255,255,.09);
      -webkit-backdrop-filter: blur(24px) saturate(185%);
      backdrop-filter: blur(24px) saturate(185%);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.38), inset 0 -1px 2px rgba(255,255,255,.07), 0 10px 32px rgba(0,0,0,.38);
    }
    .lg::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
      background: linear-gradient(140deg, rgba(255,255,255,.62), rgba(255,255,255,.06) 36%, rgba(255,255,255,.04) 64%, rgba(255,255,255,.40));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    }
    /* tap feedback: lifts, glows where you touch, springs back */
    .press { position: relative; overflow: hidden; cursor: pointer; transition: transform .55s var(--spring), background-color .25s ease; }
    .press::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s ease;
      background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), rgba(255,255,255,.42), rgba(255,255,255,0) 62%);
    }
    .press.pressed { transform: scale(1.08); transition-duration: .16s; }
    .press.pressed::after { opacity: 1; }
    .rowbtn.press.pressed { transform: scale(1.02); }

    /* ===== Layout ===== */
    .app { position: relative; z-index: 1; height: var(--app-h, 100vh); height: var(--app-h, 100dvh); max-width: 820px; margin: 0 auto; }

    /* top-right only (top-left is left free for the app's back button) */
    .top { position: absolute; z-index: 5; top: 0; right: 0; left: auto; direction: ltr; padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 0 0; }
    .tpill { display: flex; align-items: center; height: 48px; padding: 0 4px; border-radius: 999px; }
    .pbtn { display: grid; place-items: center; width: 44px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: #fff; }
    .tdiv { width: 1px; height: 22px; background: rgba(255,255,255,.2); }

    .chat {
      position: absolute; inset: 0; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
      padding: calc(env(safe-area-inset-top, 0px) + 72px) 14px calc(var(--dock-h, 120px) + 10px);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 calc(env(safe-area-inset-top, 0px) + 58px));
      mask-image: linear-gradient(to bottom, transparent 0, #000 calc(env(safe-area-inset-top, 0px) + 58px));
      scrollbar-width: none;
    }
    .chat::-webkit-scrollbar { display: none; }

    /* hero (empty state) */
    .hero { margin: auto 0; display: grid; justify-items: center; gap: 12px; padding: 8px 6px 24px; text-align: center; }
    .orb-big { position: relative; width: 92px; height: 92px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 70px rgba(150,70,225,.55), inset 0 0 0 1px rgba(255,255,255,.25); }
    .orb-big i { position: absolute; inset: -30%; background: conic-gradient(from 0deg, #7030A0, #3f2bd0, #c24fd2, #7a3fe0, #7030A0); animation: spin 11s linear infinite; }
    .orb-big::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.75), rgba(255,255,255,0) 46%); }
    .hero h1 { margin: 6px 0 0; font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1.1; font-weight: 800; letter-spacing: -.04em; background: linear-gradient(180deg, #fff 10%, #d8bdee 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero .id { margin: 0; font-size: 1.02rem; font-weight: 600; color: #efe6f6; }
    .hero .desc { margin: 0; max-width: 440px; color: var(--muted); font-size: .94rem; line-height: 1.8; }
    .starters { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 10px; }
    .hero .note { margin: 8px 0 0; color: var(--muted-2); font-size: .72rem; }

    .stream { display: flex; flex-direction: column; gap: 14px; direction: ltr; }
    .msg { display: flex; gap: 10px; max-width: 100%; animation: rise .35s ease both; }
    .msg.bot { align-self: flex-start; width: 100%; }
    .msg.user { align-self: flex-end; max-width: 88%; }
    .avatar { display: grid; place-items: center; flex: 0 0 auto; width: 30px; height: 30px; margin-top: 2px; border-radius: 50%; background: conic-gradient(from 200deg, #7030A0, #4a2cd0, #c24fd2, #7030A0); color: #fff; box-shadow: 0 0 18px rgba(150,70,225,.45), inset 0 1px 1px rgba(255,255,255,.5); }
    .bot-body { min-width: 0; flex: 1 1 auto; display: grid; gap: 10px; justify-items: start; }
    .bubble { max-width: min(100%, 620px); padding: 11px 16px; border-radius: 22px; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 1rem; line-height: 1.75; }
    .bot .bubble { border: 1px solid rgba(255,255,255,.14); border-top-left-radius: 8px; background: linear-gradient(160deg, rgba(255,255,255,.11), rgba(255,255,255,.04)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 22px rgba(0,0,0,.25); }
    .user .bubble { border: 1px solid rgba(255,255,255,.24); border-top-right-radius: 8px; background: linear-gradient(160deg, rgba(160,88,222,.92), rgba(100,40,156,.92)); box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 6px 24px rgba(112,48,160,.4); color: #fff; }
    .bubble.err { border-color: rgba(235,160,160,.4); }
    .think { display: inline-block; padding: 12px 18px; font-size: .92rem; background-image: linear-gradient(100deg, #8d7aa3 20%, #fff 45%, #8d7aa3 70%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shimmer 1.6s linear infinite; }
    @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .retry { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; margin-top: 4px; padding: 6px 16px; border: 0; border-radius: 999px; color: #fff; font-weight: 600; font-size: .88rem; }

    /* ===== Comparison card ===== */
    .card { width: 100%; padding: 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 26px; background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.035)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 10px 30px rgba(0,0,0,.28); animation: rise .45s ease both; }
    .card h4, .card h5 { margin: 0; }
    .heads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .head { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 11px; align-content: start; padding: 12px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: rgba(255,255,255,.04); }
    .thumb { display: grid; place-items: center; width: 52px; height: 52px; overflow: hidden; border-radius: 14px; background: rgba(255,255,255,.07); color: var(--accent-light); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .badge-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { display: inline-grid; place-items: center; min-width: 21px; height: 21px; padding: 0 6px; border: 1px solid rgba(196,155,224,.45); border-radius: 999px; color: #e8d3f5; font-size: .68rem; font-weight: 700; }
    .win-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: linear-gradient(160deg, #9650d6, #6a2ea4); color: #fff; font-size: .66rem; font-weight: 650; }
    .name { margin: 3px 0 0 !important; font-size: .95rem; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; line-height: 1.35; }
    .meta { margin: 0; color: var(--muted-2); font-size: .74rem; }
    .price { display: inline-block; margin-top: 4px; padding: 1px 9px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; color: #e9e0ef; font-size: .72rem; }
    .summary { grid-column: 1 / -1; margin: 2px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.7; }
    .sec { margin-top: 18px; }
    .sec-title { margin: 0 0 10px !important; color: #d8bdee; font-size: .7rem; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; }
    .legend { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 2px; color: var(--muted); font-size: .76rem; font-weight: 600; }
    .legend span { min-width: 0; overflow-wrap: anywhere; }
    .row { margin-top: 11px; }
    .row-label { margin-bottom: 4px; color: var(--muted-2); font-size: .74rem; text-align: center; }
    .bars { display: grid; grid-template-columns: 2.3em 1fr 1fr 2.3em; align-items: center; gap: 6px; }
    .num { color: var(--muted-2); font-size: .8rem; font-variant-numeric: tabular-nums; text-align: center; }
    .num.win { color: #fff; font-weight: 700; }
    .track { display: flex; height: 9px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    .track.ta { justify-content: flex-end; }
    .track.tb { justify-content: flex-start; }
    .fill { width: 0; height: 100%; border-radius: 999px; background: rgba(255,255,255,.28); transition: width .7s ease; }
    .fill.win { background: linear-gradient(90deg, #b58bd3, #d9a8f0); box-shadow: 0 0 12px rgba(196,155,224,.5); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .col-title { margin: 0 0 8px !important; font-size: .86rem; font-weight: 650; overflow-wrap: anywhere; }
    .list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .list li { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: .82rem; line-height: 1.65; }
    .list .icon { margin-top: 3px; }
    .ok { color: #b9e2c4; }
    .no { color: #e6b3b3; }
    .empty { margin: 0; color: var(--muted-2); font-size: .82rem; }
    .best { padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); }
    .best strong { display: block; margin-bottom: 4px; font-size: .86rem; overflow-wrap: anywhere; }
    .best span { color: var(--muted); font-size: .82rem; line-height: 1.7; }
    details.more { margin-top: 14px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: rgba(255,255,255,.035); }
    details.more summary { display: flex; align-items: center; min-height: 46px; padding: 0 16px; color: #d8bdee; font-size: .7rem; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; }
    details.more .inner { padding: 0 14px 14px; }
    .table-wrap { overflow-x: auto; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; }
    table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: .8rem; }
    th, td { padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: start; vertical-align: top; }
    thead th { background: rgba(255,255,255,.05); color: #e9e0ef; }
    tbody th { color: var(--muted-2); font-weight: 600; white-space: nowrap; }
    tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
    td.best-cell { background: rgba(130,64,190,.3); color: #fff; font-weight: 650; }
    .verdict { margin-top: 18px; padding: 16px; border: 1px solid rgba(196,155,224,.4); border-radius: 22px; background: linear-gradient(135deg, rgba(130,64,190,.30), rgba(112,48,160,.06)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
    .verdict-top { display: flex; align-items: center; gap: 12px; }
    .verdict-icon { display: grid; place-items: center; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: rgba(130,64,190,.4); color: #f0defa; box-shadow: inset 0 1px 1px rgba(255,255,255,.4); }
    .verdict-kicker { margin: 0 !important; color: #d8bdee; font-size: .68rem; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; }
    .verdict-name { margin: 1px 0 0 !important; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
    .verdict-reason { margin: 11px 0 0; color: #e2dae9; font-size: .9rem; line-height: 1.8; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .disclaimer { flex: 1 1 220px; margin: 0; color: var(--muted-2); font-size: .72rem; line-height: 1.65; }
    .copy-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 6px 16px; border: 0; border-radius: 999px; color: #f6f0fa; font-size: .84rem; font-weight: 600; }

    /* ===== Dock: chips + composer (regular blur, liquid-glass shape) ===== */
    .dock { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 10px); }
    .chips { display: flex; gap: 8px; margin-bottom: 9px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips:empty { display: none; }
    .chip { flex: 0 0 auto; min-height: 40px; padding: 6px 16px; border: 0; border-radius: 999px; background: rgba(255,255,255,.09); color: #f0e8f6; font-size: .84rem; white-space: nowrap; box-shadow: inset 0 1px 1px rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.28); }
    .chip.lg { -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); }
    .compose { display: flex; align-items: flex-end; gap: 8px; padding: 6px; border-radius: 28px; background: rgba(26,21,38,.5); -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); transition: box-shadow .5s ease; }
    body.thinking .compose { box-shadow: inset 0 1px 1px rgba(255,255,255,.4), 0 0 0 1px rgba(196,155,224,.5), 0 0 34px rgba(150,80,230,.5); }
    .compose textarea { flex: 1 1 auto; min-width: 0; max-height: 132px; padding: 10px 6px 10px 14px; border: 0; outline: none; resize: none; background: transparent; font-size: 16px; line-height: 1.5; color: var(--text); }
    [dir="rtl"] .compose textarea { padding: 10px 14px 10px 6px; }
    .compose textarea::placeholder { color: var(--muted-2); }
    .send { display: grid; place-items: center; flex: 0 0 auto; width: 44px; height: 44px; border: 0; border-radius: 50%; background: linear-gradient(160deg, #9650d6, #6528a0); color: #fff; box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 6px 18px rgba(112,48,160,.5); }
    .send:disabled { opacity: .45; cursor: not-allowed; }
    .send.press.pressed { transform: scale(1.14); }

    /* ===== History sheet ===== */
    .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s; }
    .scrim.open { opacity: 1; visibility: visible; }
    .sheet { position: fixed; z-index: 21; left: 50%; bottom: 0; width: min(560px, 100%); max-height: 82vh; max-height: 82dvh; display: flex; flex-direction: column; margin: 0 auto; padding: 0 0 env(safe-area-inset-bottom, 0px); border-radius: 32px 32px 0 0; background: rgba(24,19,36,.62); transform: translate(-50%, 105%); visibility: hidden; transition: transform .55s var(--spring), visibility .55s; }
    .sheet.open { transform: translate(-50%, 0); visibility: visible; }
    .grab { width: 38px; height: 5px; margin: 9px auto 0; border-radius: 99px; background: rgba(255,255,255,.3); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 8px; }
    .sheet-head h2 { margin: 0; font-size: 1.2rem; font-weight: 750; letter-spacing: -.02em; }
    .xbtn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; }
    .hist { flex: 1 1 auto; min-height: 90px; overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 10px; display: grid; align-content: start; gap: 8px; }
    .hrow { display: flex; align-items: stretch; gap: 6px; }
    .rowbtn { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; padding: 11px 16px; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; background: rgba(255,255,255,.06); text-align: start; color: var(--text); }
    .rowbtn.active { border-color: rgba(196,155,224,.55); background: rgba(130,64,190,.25); }
    .rowbtn .t { font-weight: 600; font-size: .94rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rowbtn .d { color: var(--muted-2); font-size: .74rem; }
    .delbtn { display: grid; place-items: center; flex: 0 0 auto; min-width: 46px; padding: 0 12px; border: 0; border-radius: 20px; background: rgba(255,255,255,.06); color: #e6b3b3; font-size: .78rem; font-weight: 650; }
    .delbtn.sure { background: rgba(200,70,90,.45); color: #fff; }
    .hempty { margin: 24px 0; text-align: center; color: var(--muted-2); font-size: .92rem; }
    .sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px 14px; border-top: 1px solid rgba(255,255,255,.08); }
    .switch { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.08); }
    .switch button { min-width: 46px; min-height: 36px; padding: 4px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: .82rem; font-weight: 650; }
    .switch button[aria-pressed="true"] { background: linear-gradient(160deg, #9650d6, #6528a0); color: #fff; }

  <noscript><div style="position:fixed;inset:auto 12px 12px 12px;z-index:99;padding:12px 15px;background:#17121d;color:#fff;border:1px solid #7030A0;border-radius:16px;text-align:center">JavaScript is required to chat with newniom ai.</div></noscript>

  <script>
  (() => {
    'use strict';

    // >>> Your Worker address (no trailing slash, no /chat) <<<
    const WORKER_URL = 'https://newniom-compare.newniom-com.workers.dev';

    const KEY = 'newniom-ai-chats-v1';
    const LANG_KEY = 'newniom-ai-lang';
    const MAX_CHARS = 500, MAX_CHATS = 40, MAX_MSGS = 60;
    const NS = 'http://www.w3.org/2000/svg';
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if ((navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2)) document.body.classList.add('lite');

    const I18N = {
      en: {
        placeholder: 'Ask me to compare two devices…', send: 'Send', history: 'History', newChat: 'New chat', close: 'Close',
        heroId: "I'm newniom ai, an AI built by Newniom.",
        heroDesc: "I compare phones, laptops, tablets and computers. Tell me two devices and I'll break it down.",
        note: 'newniom ai can make mistakes. Check specs and prices before you buy.',
        thinking: 'Thinking…',
        cmpText: 'Compare {a} and {b}',
        follow: ['Which is better for gaming?', 'Which has the better camera?', 'Which one lasts longer?'],
        noChats: 'No chats yet', clearAll: 'Clear all', del: 'Delete', sure: 'Sure?', untitled: 'New chat',
        errNetwork: "I couldn't reach the server. Check your connection and try again.",
        errTimeout: 'That took too long. Please try again.',
        errRate: 'Too many messages. Give me a minute and try again.',
        errQuota: "Today's free AI quota is used up. Please try again later.",
        errBad: "I couldn't read that message. Try rephrasing it.",
        errServer: 'Something went wrong on my side. Please try again.',
        retry: 'Try again',
        scores: 'Scores', specs: 'Specifications', advantages: 'Advantages', bestFor: 'Best for', prosCons: 'Pros & cons',
        verdict: 'Verdict', spec: 'Spec', winner: 'Winner', tie: "It's a tie", over: '{x} over {y}',
        copy: 'Copy summary', copied: 'Copied', copyFail: 'Copy failed', none: '—',
        m: { performance: 'Performance', display: 'Display', camera: 'Camera', battery: 'Battery', portability: 'Portability', value: 'Value' },
        s: { screen: 'Screen', processor: 'Processor', ram: 'RAM', storage: 'Storage', camera: 'Camera', battery: 'Battery', os: 'OS', weight: 'Weight' },
      },
      fa: {
        placeholder: 'از من بخواه دو دستگاه را مقایسه کنم…', send: 'ارسال', history: 'تاریخچه', newChat: 'گفتگوی جدید', close: 'بستن',
        heroId: 'من هوش مصنوعی newniom ai هستم.',
        heroDesc: 'گوشی، لپ‌تاپ، تبلت و کامپیوتر مقایسه می‌کنم. دو دستگاه را بگو تا برایت بررسی کنم.',
        note: 'newniom ai ممکن است اشتباه کند. پیش از خرید مشخصات و قیمت را بررسی کن.',
        thinking: 'در حال فکر کردن…',
        cmpText: '{a} را با {b} مقایسه کن',
        follow: ['برای گیمینگ کدام بهتر است؟', 'دوربین کدام بهتر است؟', 'کدام بادوام‌تر است؟'],
        noChats: 'هنوز گفتگویی نداری', clearAll: 'پاک کردن همه', del: 'حذف', sure: 'مطمئنی؟', untitled: 'گفتگوی جدید',
        errNetwork: 'به سرور وصل نشدم. اینترنتت را بررسی کن و دوباره تلاش کن.',
        errTimeout: 'خیلی طول کشید. دوباره تلاش کن.',
        errRate: 'پیام‌ها زیاد بود. یک دقیقه صبر کن و دوباره تلاش کن.',
        errQuota: 'سهمیه‌ی رایگان امروز تمام شده است. بعداً دوباره تلاش کن.',
        errBad: 'نتوانستم پیامت را بخوانم. کمی بازنویسی‌اش کن.',
        errServer: 'مشکلی از سمت من پیش آمد. دوباره تلاش کن.',
        retry: 'تلاش دوباره',
        scores: 'امتیازها', specs: 'مشخصات فنی', advantages: 'برتری‌ها', bestFor: 'مناسب برای', prosCons: 'مزایا و معایب',
        verdict: 'نتیجه‌ی نهایی', spec: 'مشخصه', winner: 'برنده', tie: 'مساوی', over: '{x} نسبت به {y}',
        copy: 'کپی خلاصه', copied: 'کپی شد', copyFail: 'کپی نشد', none: '—',
        m: { performance: 'عملکرد', display: 'نمایشگر', camera: 'دوربین', battery: 'باتری', portability: 'قابلیت حمل', value: 'ارزش خرید' },
        s: { screen: 'صفحه‌نمایش', processor: 'پردازنده', ram: 'رم', storage: 'حافظه', camera: 'دوربین', battery: 'باتری', os: 'سیستم‌عامل', weight: 'وزن' },
      },
    };
    const STARTERS = [['iPhone 16', 'Galaxy S25'], ['MacBook Air M3', 'Dell XPS 13'], ['iPad Air', 'Galaxy Tab S9']];
    const METRICS = ['performance', 'display', 'camera', 'battery', 'portability', 'value'];
    const SPECS = ['screen', 'processor', 'ram', 'storage', 'camera', 'battery', 'os', 'weight'];
    const SPEC_SCORE = { screen: 'display', processor: 'performance', ram: 'performance', camera: 'camera', battery: 'battery', weight: 'portability' };

    const $ = (id) => document.getElementById(id);
    const el = {
      chat: $('chat'), stream: $('stream'), hero: $('hero'), starters: $('starters'), chips: $('chips'), form: $('form'),
      input: $('input'), send: $('send'), dock: $('dock'), btnNew: $('btnNew'), btnHistory: $('btnHistory'),
      scrim: $('scrim'), sheet: $('sheet'), hist: $('hist'), btnClose: $('btnClose'), btnClear: $('btnClear'),
    };

    /* ---------- language ---------- */
    let lang = 'en';
    try {
      const s = localStorage.getItem(LANG_KEY);
      if (s === 'en' || s === 'fa') lang = s; else if (/^fa/i.test(navigator.language || '')) lang = 'fa';
    } catch (e) { if (/^fa/i.test(navigator.language || '')) lang = 'fa'; }
    const tr = (L, k) => I18N[L][k];
    const t = (k) => tr(lang, k);

    /* ---------- storage (chat history survives app restarts) ---------- */
    let store = { chats: [], currentId: null };
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && Array.isArray(p.chats)) {
          store.chats = p.chats.filter((c) => c && typeof c.id === 'string' && Array.isArray(c.msgs) && c.msgs.length).slice(0, MAX_CHATS);
          store.currentId = typeof p.currentId === 'string' ? p.currentId : null;
        }
      }
    } catch (e) {}
    let saveTimer = 0;
    function persist() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        for (let i = 0; i < 8; i++) {
          try { localStorage.setItem(KEY, JSON.stringify(store)); return; }
          catch (e) { if (store.chats.length <= 1) return; store.chats.pop(); }   // storage full: drop the oldest chat
        }
      }, 150);
    }
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const freshChat = () => ({ id: uid(), title: '', updated: Date.now(), msgs: [] });
    let cur = store.chats.find((c) => c.id === store.currentId) || freshChat();
    function touch() {
      cur.updated = Date.now();
      if (cur.msgs.length > MAX_MSGS) cur.msgs = cur.msgs.slice(-MAX_MSGS);
      if (!store.chats.includes(cur)) store.chats.unshift(cur);
      else { store.chats.splice(store.chats.indexOf(cur), 1); store.chats.unshift(cur); }
      if (store.chats.length > MAX_CHATS) store.chats.length = MAX_CHATS;
      store.currentId = cur.id;
      persist();
    }

    /* ---------- tiny DOM helpers (all text goes through textContent) ---------- */
    const h = (tag, cls, txt) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (txt !== undefined && txt !== null) n.textContent = String(txt);
      return n;
    };
    const auto = (n) => { n.setAttribute('dir', 'auto'); return n; };
    const ico = (id, cls) => {
      const s = document.createElementNS(NS, 'svg');
      s.setAttribute('class', 'icon' + (cls ? ' ' + cls : ''));
      s.setAttribute('aria-hidden', 'true');
      const u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#' + id);
      s.appendChild(u);
      return s;
    };
    const known = (v) => v !== undefined && v !== null && String(v).trim() !== '' && String(v).toLowerCase() !== 'unknown';
    const num = (v) => { const n = typeof v === 'string' ? parseFloat(v) : v; return typeof n === 'number' && isFinite(n) ? Math.max(0, Math.min(10, n)) : null; };
    const fmt = (L, n) => (n === null ? tr(L, 'none') : String(Math.round(n * 10) / 10));
    const nearBottom = () => el.chat.scrollHeight - el.chat.scrollTop - el.chat.clientHeight < 160;
    const toBottom = (instant) => { el.chat.scrollTo({ top: el.chat.scrollHeight, behavior: instant || reduceMotion ? 'auto' : 'smooth' }); };

    /* ---------- liquid-glass press feedback ---------- */
    const downAt = new WeakMap();
    document.addEventListener('pointerdown', (e) => {
      const n = e.target.closest && e.target.closest('.press');
      if (!n || n.disabled) return;
      const r = n.getBoundingClientRect();
      n.style.setProperty('--px', (e.clientX - r.left) + 'px');
      n.style.setProperty('--py', (e.clientY - r.top) + 'px');
      n.classList.add('pressed');
      downAt.set(n, Date.now());
      if (navigator.vibrate) { try { navigator.vibrate(6); } catch (x) {} }
    }, { passive: true });
    const release = () => {
      document.querySelectorAll('.pressed').forEach((n) => {
        const wait = Math.max(0, 140 - (Date.now() - (downAt.get(n) || 0)));
        setTimeout(() => n.classList.remove('pressed'), wait);
      });
    };
    document.addEventListener('pointerup', release, { passive: true });
    document.addEventListener('pointercancel', release, { passive: true });

    /* ---------- chrome / language ---------- */
    function applyChrome() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = t(n.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-ph]').forEach((n) => n.setAttribute('placeholder', t(n.getAttribute('data-i18n-ph'))));
      document.querySelectorAll('[data-i18n-aria]').forEach((n) => n.setAttribute('aria-label', t(n.getAttribute('data-i18n-aria'))));
      document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)));
      buildStarters();
    }
    document.querySelectorAll('[data-lang]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-lang');
        if (next === lang) return;
        lang = next;
        try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
        applyChrome();
        renderHistory();
        refreshChips();
      });
    });

    /* ---------- chips ---------- */
    function makeChip(label, text) {
      const b = h('button', 'chip lg press', label);
      b.type = 'button';
      b.addEventListener('click', () => send(text));
      return b;
    }
    function buildStarters() {
      el.starters.replaceChildren();
      STARTERS.forEach(([a, b]) => el.starters.append(makeChip(a + ' vs ' + b, tr(lang, 'cmpText').replace('{a}', a).replace('{b}', b))));
    }
    function refreshChips() {
      el.chips.replaceChildren();
      const lastBot = [...cur.msgs].reverse().find((m) => m.r === 'a');
      if (!lastBot || !cur.msgs.some((m) => m.r === 'a' && m.c)) return;
      tr(lastBot.l === 'fa' ? 'fa' : 'en', 'follow').forEach((x) => el.chips.append(makeChip(x, x)));
    }

    /* ---------- messages ---------- */
    function addUser(text) {
      const m = h('div', 'msg user');
      m.append(auto(h('div', 'bubble', text)));
      el.stream.append(m);
    }
    function botShell() {
      const m = h('div', 'msg bot');
      const av = h('span', 'avatar'); av.append(ico('i-spark', 'icon-sm'));
      const body = h('div', 'bot-body');
      m.append(av, body);
      el.stream.append(m);
      return { m, body };
    }
    function addTyping() {
      const { m, body } = botShell();
      const b = h('div', 'bubble');
      b.append(h('span', 'think', t('thinking')));
      body.append(b);
      toBottom();
      return m;
    }
    function typeInto(node, text) {
      return new Promise((resolve) => {
        if (reduceMotion || text.length < 8) { node.textContent = text; return resolve(); }
        const step = Math.max(1, Math.ceil(text.length / 70));
        let i = 0;
        const tick = () => {
          i = Math.min(text.length, i + step);
          node.textContent = text.slice(0, i);
          if (nearBottom()) el.chat.scrollTop = el.chat.scrollHeight;
          if (i < text.length) setTimeout(tick, 22); else resolve();
        };
        tick();
      });
    }
    async function addBot(text, L, comparison, instant) {
      const { m, body } = botShell();
      if (instant) m.style.animation = 'none';
      const bubble = h('div', 'bubble');
      bubble.setAttribute('dir', 'auto'); bubble.lang = L;
      const vis = h('span');
      vis.setAttribute('aria-hidden', 'true');
      bubble.append(vis, h('span', 'sr', text));
      body.append(bubble);
      if (instant) vis.textContent = text; else { toBottom(); await typeInto(vis, text); }
      if (comparison) {
        try {
          const card = buildCard(comparison, L);
          if (instant) { card.style.animation = 'none'; card.querySelectorAll('.fill').forEach((f) => { f.style.transition = 'none'; f.style.width = f.dataset.w + '%'; }); }
          body.append(card);
          if (!instant) {
            animateBars(card);
            m.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
          }
        } catch (e) { /* ignore a malformed stored card */ }
      }
      return m;
    }
    function addError(code) {
      const map = { rate_limited: 'errRate', quota_exceeded: 'errQuota', bad_input: 'errBad', bad_request: 'errBad', timeout: 'errTimeout', network: 'errNetwork' };
      const { m, body } = botShell();
      const b = h('div', 'bubble err', t(map[code] || 'errServer'));
      b.setAttribute('dir', 'auto');
      body.append(b);
      const btn = h('button', 'retry lg press');
      btn.type = 'button';
      btn.append(ico('i-retry', 'icon-sm'), h('span', '', t('retry')));
      btn.addEventListener('click', () => { m.remove(); ask(); });
      body.append(btn);
      toBottom();
    }

    function renderChat() {
      el.stream.replaceChildren();
      el.hero.hidden = cur.msgs.length > 0;
      cur.msgs.forEach((m) => {
        if (m.r === 'u') addUser(m.t);
        else addBot(m.t, m.l === 'fa' ? 'fa' : 'en', m.c || null, true);
      });
      refreshChips();
      requestAnimationFrame(() => toBottom(true));
    }

    /* ---------- worker call ---------- */
    function compact(m) {
      let s = m.t;
      const c = m.c;
      if (c && c.devices && c.devices.length === 2) {
        const [A, B] = c.devices;
        const w = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : 'tie';
        const sc = METRICS.map((k) => k + ' ' + fmt('en', num(A.scores[k])) + '/' + fmt('en', num(B.scores[k]))).join(', ');
        s += '\n[comparison card shown: ' + A.name + ' vs ' + B.name + '; winner: ' + w + '; scores ' + sc + ']';
      }
      return s.slice(0, 850);
    }
    const apiMessages = () => cur.msgs.slice(-10).map((m) => (m.r === 'u' ? { role: 'user', content: m.t } : { role: 'assistant', content: compact(m) }));

    async function callChat(messages) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 55000);
      let res;
      try {
        res = await fetch(WORKER_URL.replace(/\/+$/, '') + '/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lang, messages }), signal: ctrl.signal,
        });
      } catch (e) {
        throw { code: e && e.name === 'AbortError' ? 'timeout' : 'network' };
      } finally { clearTimeout(timer); }
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok || !data) throw { code: (data && data.error) || 'server' };
      return data;
    }

    let busy = false, session = 0;
    const setThinking = (v) => document.body.classList.toggle('thinking', v);

    function send(text) {
      text = String(text || '').replace(/[ \t]+\n/g, '\n').trim().slice(0, MAX_CHARS);
      if (!text || busy) return;
      el.chips.replaceChildren();
      el.hero.hidden = true;
      addUser(text);
      cur.msgs.push({ r: 'u', t: text });
      if (!cur.title) cur.title = text.replace(/\s+/g, ' ').slice(0, 48);
      touch();
      el.input.value = '';
      autosize();
      toBottom();
      ask();
    }

    async function ask() {
      const mine = session;
      busy = true; el.send.disabled = true; setThinking(true);
      const typing = addTyping();
      try {
        const data = await callChat(apiMessages());
        if (mine !== session) return;
        typing.remove();
        setThinking(false);
        const L = data.lang === 'fa' ? 'fa' : 'en';
        cur.msgs.push({ r: 'a', t: data.reply, l: L, c: data.comparison || null });
        touch();
        await addBot(data.reply, L, data.comparison || null, false);
        if (mine === session) refreshChips();
      } catch (err) {
        if (mine !== session) return;
        typing.remove();
        setThinking(false);
        addError(err && err.code);
      } finally {
        if (mine === session) { busy = false; el.send.disabled = false; setThinking(false); }
      }
    }

    /* ---------- images (Wikipedia) ---------- */
    const imgCache = new Map();
    function wikiImage(name) {
      if (imgCache.has(name)) return imgCache.get(name);
      const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=200&gsrsearch=' + encodeURIComponent(name);
      const p = fetch(u).then((r) => r.json()).then((j) => {
        const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
        pages.sort((x, y) => (x.index || 0) - (y.index || 0));
        const hit = pages.find((pg) => pg.thumbnail && pg.thumbnail.source);
        if (!hit) return null;
        try { return /(^|\.)wikimedia\.org$/.test(new URL(hit.thumbnail.source).hostname) ? hit.thumbnail.source : null; } catch (e) { return null; }
      }).catch(() => null);
      imgCache.set(name, p);
      return p;
    }
    function iconFor(d, category) {
      const map = { phone: 'phone', laptop: 'laptop', tablet: 'tablet', computer: 'desktop' };
      if (map[category]) return 'i-' + map[category];
      const n = String(d.name || '').toLowerCase();
      if (/iphone|galaxy s|galaxy z|pixel|phone|redmi|poco|oneplus|xperia/.test(n)) return 'i-phone';
      if (/ipad|tab |tablet|matepad/.test(n)) return 'i-tablet';
      if (/macbook|laptop|thinkpad|zenbook|xps|legion|zephyrus|ideapad|vivobook|inspiron|spectre/.test(n)) return 'i-laptop';
      if (/imac|mac mini|mac studio|mac pro|desktop|tower|optiplex|all-in-one|nuc/.test(n)) return 'i-desktop';
      return 'i-cpu';
    }

    /* ---------- comparison card ---------- */
    function list(L, items, iconId, cls) {
      const arr = Array.isArray(items) ? items.filter(Boolean) : [];
      if (!arr.length) return auto(h('p', 'empty', tr(L, 'none')));
      const ul = h('ul', 'list');
      arr.forEach((s) => { const li = h('li'); li.append(ico(iconId, 'icon-sm ' + cls), auto(h('span', '', s))); ul.append(li); });
      return ul;
    }
    function headCard(L, d, letter, c) {
      const box = h('div', 'head');
      const th = h('div', 'thumb'); th.append(ico(iconFor(d, c.category), 'icon-lg'));
      const body = h('div');
      const row = h('div', 'badge-row');
      row.append(h('span', 'badge', letter.toUpperCase()));
      if (c.verdict.winner === letter) { const w = h('span', 'win-chip'); w.append(ico('i-trophy', 'icon-sm'), h('span', '', tr(L, 'winner'))); row.append(w); }
      body.append(row, auto(h('h4', 'name', d.name)));
      const meta = [d.brand, d.year].filter(known).join(' · ');
      if (meta) body.append(auto(h('p', 'meta', meta)));
      if (known(d.price_range)) body.append(auto(h('span', 'price', d.price_range)));
      box.append(th, body, auto(h('p', 'summary', d.summary || '')));
      wikiImage(d.name).then((src) => {
        if (!src || !th.isConnected) return;
        const img = document.createElement('img');
        img.loading = 'lazy'; img.decoding = 'async'; img.alt = d.name; img.referrerPolicy = 'no-referrer';
        img.addEventListener('load', () => th.replaceChildren(img));
        img.src = src;
      });
      return box;
    }
    function buildCard(c, L) {
      const [A, B] = c.devices;
      const card = h('section', 'card');
      card.setAttribute('dir', L === 'fa' ? 'rtl' : 'ltr');
      card.lang = L;

      const heads = h('div', 'heads');
      heads.append(headCard(L, A, 'a', c), headCard(L, B, 'b', c));
      card.append(heads);

      const sc = h('div', 'sec');
      sc.append(h('h5', 'sec-title', tr(L, 'scores')));
      const legend = h('div', 'legend');
      legend.append(auto(h('span', '', A.name)), auto(h('span', '', B.name)));
      sc.append(legend);
      METRICS.forEach((k) => {
        const a = num(A.scores && A.scores[k]), b = num(B.scores && B.scores[k]);
        const aw = a !== null && b !== null && a > b, bw = a !== null && b !== null && b > a;
        const row = h('div', 'row');
        row.setAttribute('role', 'group');
        row.setAttribute('aria-label', tr(L, 'm')[k] + ': ' + A.name + ' ' + fmt(L, a) + ', ' + B.name + ' ' + fmt(L, b));
        row.append(h('div', 'row-label', tr(L, 'm')[k]));
        const bars = h('div', 'bars');
        const ta = h('div', 'track ta'), tb = h('div', 'track tb');
        const fa = h('div', 'fill' + (aw ? ' win' : '')), fb = h('div', 'fill' + (bw ? ' win' : ''));
        fa.dataset.w = a === null ? 0 : a * 10; fb.dataset.w = b === null ? 0 : b * 10;
        ta.append(fa); tb.append(fb);
        bars.append(h('span', 'num' + (aw ? ' win' : ''), fmt(L, a)), ta, tb, h('span', 'num' + (bw ? ' win' : ''), fmt(L, b)));
        row.append(bars);
        sc.append(row);
      });
      card.append(sc);

      const adv = h('div', 'sec');
      adv.append(h('h5', 'sec-title', tr(L, 'advantages')));
      const cols = h('div', 'cols');
      const c1 = h('div'), c2 = h('div');
      c1.append(auto(h('h5', 'col-title', tr(L, 'over').replace('{x}', A.name).replace('{y}', B.name))), list(L, c.advantages && c.advantages.a_over_b, 'i-check', 'ok'));
      c2.append(auto(h('h5', 'col-title', tr(L, 'over').replace('{x}', B.name).replace('{y}', A.name))), list(L, c.advantages && c.advantages.b_over_a, 'i-check', 'ok'));
      cols.append(c1, c2);
      adv.append(cols);
      card.append(adv);

      const best = h('div', 'sec');
      best.append(h('h5', 'sec-title', tr(L, 'bestFor')));
      const bc = h('div', 'cols');
      [[A, 'a'], [B, 'b']].forEach(([d, k]) => {
        const x = h('div', 'best');
        x.append(auto(h('strong', '', d.name)), auto(h('span', '', (c.best_for && c.best_for[k]) || tr(L, 'none'))));
        bc.append(x);
      });
      best.append(bc);
      card.append(best);

      const dSpecs = h('details', 'more');
      dSpecs.append(h('summary', '', tr(L, 'specs')));
      const inner = h('div', 'inner');
      const wrap = h('div', 'table-wrap'); wrap.tabIndex = 0;
      wrap.setAttribute('role', 'region'); wrap.setAttribute('aria-label', tr(L, 'specs'));
      const table = h('table');
      const thead = h('thead'), hr = h('tr');
      [tr(L, 'spec'), A.name, B.name].forEach((x) => { const th = auto(h('th', '', x)); th.scope = 'col'; hr.append(th); });
      thead.append(hr);
      const tbody = h('tbody');
      SPECS.forEach((k) => {
        const row = h('tr');
        const th = h('th', '', tr(L, 's')[k]); th.scope = 'row';
        const va = A.specs && A.specs[k], vb = B.specs && B.specs[k];
        const ca = auto(h('td', '', known(va) ? va : tr(L, 'none'))), cb = auto(h('td', '', known(vb) ? vb : tr(L, 'none')));
        const sk = SPEC_SCORE[k];
        if (sk) {
          const a = num(A.scores && A.scores[sk]), b = num(B.scores && B.scores[sk]);
          if (a !== null && b !== null && a !== b) {
            if (a > b && known(va)) ca.classList.add('best-cell');
            if (b > a && known(vb)) cb.classList.add('best-cell');
          }
        }
        row.append(th, ca, cb);
        tbody.append(row);
      });
      table.append(thead, tbody);
      wrap.append(table);
      inner.append(wrap);
      dSpecs.append(inner);
      card.append(dSpecs);

      const dPc = h('details', 'more');
      dPc.append(h('summary', '', tr(L, 'prosCons')));
      const inner2 = h('div', 'inner');
      const pc = h('div', 'cols');
      [A, B].forEach((d) => {
        const x = h('div');
        x.append(auto(h('h5', 'col-title', d.name)), list(L, d.pros, 'i-check', 'ok'));
        const cons = (d.cons || []).filter(Boolean);
        if (cons.length) { const sp = h('div'); sp.style.height = '8px'; x.append(sp, list(L, cons, 'i-x', 'no')); }
        pc.append(x);
      });
      inner2.append(pc);
      dPc.append(inner2);
      card.append(dPc);

      const v = h('div', 'verdict');
      const top = h('div', 'verdict-top');
      const vi = h('span', 'verdict-icon'); vi.append(ico('i-trophy', 'icon-lg'));
      const vt = h('div');
      const winName = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : tr(L, 'tie');
      vt.append(h('p', 'verdict-kicker', tr(L, 'verdict')), auto(h('p', 'verdict-name', winName)));
      top.append(vi, vt);
      v.append(top);
      if (c.verdict.reason) v.append(auto(h('p', 'verdict-reason', c.verdict.reason)));
      const foot = h('div', 'card-foot');
      if (c.disclaimer) foot.append(auto(h('p', 'disclaimer', c.disclaimer)));
      const cp = h('button', 'copy-btn lg press');
      cp.type = 'button';
      const cpLabel = h('span', '', tr(L, 'copy'));
      cp.append(ico('i-copy', 'icon-sm'), cpLabel);
      cp.addEventListener('click', async () => {
        const ok = await copyText(summaryText(c, L));
        cpLabel.textContent = tr(L, ok ? 'copied' : 'copyFail');
        setTimeout(() => { cpLabel.textContent = tr(L, 'copy'); }, 2000);
      });
      foot.append(cp);
      v.append(foot);
      card.append(v);
      return card;
    }
    function animateBars(card) {
      const fills = card.querySelectorAll('.fill');
      requestAnimationFrame(() => requestAnimationFrame(() => fills.forEach((f) => { f.style.width = f.dataset.w + '%'; })));
    }
    function summaryText(c, L) {
      const [A, B] = c.devices;
      const w = c.verdict.winner === 'a' ? A.name : c.verdict.winner === 'b' ? B.name : tr(L, 'tie');
      const lines = ['newniom ai — ' + A.name + ' vs ' + B.name, tr(L, 'winner') + ': ' + w];
      if (c.verdict.reason) lines.push(c.verdict.reason);
      lines.push('');
      METRICS.forEach((k) => lines.push(tr(L, 'm')[k] + ': ' + fmt(L, num(A.scores[k])) + ' / ' + fmt(L, num(B.scores[k]))));
      return lines.join('\n');
    }
    async function copyText(text) {
      try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      } catch (e) { return false; }
    }

    /* ---------- composer ---------- */
    function autosize() {
      el.input.style.height = 'auto';
      el.input.style.height = Math.min(el.input.scrollHeight, 132) + 'px';
    }
    el.input.addEventListener('input', autosize);
    el.input.addEventListener('focus', () => setTimeout(() => toBottom(), 320));
    el.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); send(el.input.value); }
    });
    el.form.addEventListener('submit', (e) => { e.preventDefault(); send(el.input.value); });

    /* ---------- chats: new / open / delete ---------- */
    function startNew() {
      if (!cur.msgs.length) { if (!coarse) el.input.focus(); return; }
      session++; busy = false; el.send.disabled = false; setThinking(false);
      cur = freshChat();
      store.currentId = cur.id; persist();
      renderChat();
      el.input.value = ''; autosize();
    }
    function openChat(id) {
      const c = store.chats.find((x) => x.id === id);
      if (!c) return;
      session++; busy = false; el.send.disabled = false; setThinking(false);
      cur = c;
      store.currentId = id; persist();
      renderChat();
    }
    function deleteChat(id) {
      store.chats = store.chats.filter((x) => x.id !== id);
      if (cur.id === id) { session++; busy = false; el.send.disabled = false; setThinking(false); cur = freshChat(); store.currentId = cur.id; renderChat(); }
      persist(); renderHistory();
    }
    el.btnNew.addEventListener('click', startNew);

    /* ---------- history sheet ---------- */
    let sheetOpen = false;
    const when = (ts) => {
      try { return new Intl.DateTimeFormat(lang === 'fa' ? 'fa-IR' : undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(ts)); } catch (e) { return ''; }
    };
    let clearArmed = 0;
    function renderHistory() {
      el.hist.replaceChildren();
      el.btnClear.classList.remove('sure'); el.btnClear.textContent = t('clearAll'); clearArmed = 0;
      const items = store.chats.filter((c) => c.msgs.length);
      el.btnClear.hidden = !items.length;
      if (!items.length) { el.hist.append(h('p', 'hempty', t('noChats'))); return; }
      items.forEach((c) => {
        const row = h('div', 'hrow');
        const b = h('button', 'rowbtn press' + (c.id === cur.id ? ' active' : ''));
        b.type = 'button';
        b.append(auto(h('span', 't', c.title || t('untitled'))), h('span', 'd', when(c.updated)));
        b.addEventListener('click', () => { openChat(c.id); closeSheet(); });
        const d = h('button', 'delbtn press');
        d.type = 'button';
        d.setAttribute('aria-label', t('del'));
        d.append(ico('i-trash', 'icon-sm'));
        let armed = 0;
        d.addEventListener('click', () => {
          if (armed) { deleteChat(c.id); return; }
          armed = 1; d.classList.add('sure'); d.replaceChildren(h('span', '', t('sure')));
          setTimeout(() => { if (d.isConnected) { armed = 0; d.classList.remove('sure'); d.replaceChildren(ico('i-trash', 'icon-sm')); } }, 3000);
        });
        row.append(b, d);
        el.hist.append(row);
      });
    }
    el.btnClear.addEventListener('click', () => {
      if (clearArmed) {
        store.chats = []; session++; busy = false; el.send.disabled = false; setThinking(false);
        cur = freshChat(); store.currentId = cur.id; persist(); renderChat(); renderHistory(); return;
      }
      clearArmed = 1; el.btnClear.classList.add('sure'); el.btnClear.textContent = t('sure');
      setTimeout(() => { if (clearArmed) { clearArmed = 0; el.btnClear.classList.remove('sure'); el.btnClear.textContent = t('clearAll'); } }, 3000);
    });
    function openSheet() {
      if (sheetOpen) return;
      renderHistory();
      sheetOpen = true;
      el.sheet.inert = false; el.sheet.setAttribute('aria-hidden', 'false');
      el.sheet.classList.add('open'); el.scrim.classList.add('open');
      try { history.pushState({ sheet: 1 }, ''); } catch (e) {}
    }
    function closeSheet(fromPop) {
      if (!sheetOpen) return;
      sheetOpen = false;
      el.sheet.classList.remove('open'); el.scrim.classList.remove('open');
      el.sheet.inert = true; el.sheet.setAttribute('aria-hidden', 'true');
      if (!fromPop) { try { if (history.state && history.state.sheet) history.back(); } catch (e) {} }
    }
    el.btnHistory.addEventListener('click', openSheet);
    el.btnClose.addEventListener('click', () => closeSheet());
    el.scrim.addEventListener('click', () => closeSheet());
    window.addEventListener('popstate', () => { if (sheetOpen) closeSheet(true); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    // For the host app: webView.evaluateJavascript("window.newniomBack && window.newniomBack()") -> true if the page handled "back"
    window.newniomBack = () => { if (sheetOpen) { closeSheet(); return true; } return false; };

    /* ---------- viewport / performance ---------- */
    if (window.ResizeObserver) new ResizeObserver(() => document.documentElement.style.setProperty('--dock-h', el.dock.offsetHeight + 'px')).observe(el.dock);
    if (window.visualViewport) {
      const vv = window.visualViewport;
      const upd = () => document.documentElement.style.setProperty('--app-h', Math.round(vv.height) + 'px');
      vv.addEventListener('resize', upd); upd();
    }
    const flush = () => { clearTimeout(saveTimer); try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
    document.addEventListener('visibilitychange', () => { document.body.classList.toggle('paused', document.hidden); if (document.hidden) flush(); });
    window.addEventListener('pagehide', flush);

    /* ---------- boot ---------- */
    applyChrome();
    renderChat();
  })();
  </script>
</body>
</html>
